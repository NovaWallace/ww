    function richHtmlToTokens(html) {
      const template = document.createElement("template");
      template.innerHTML = sanitizeSkillRichText(html);
      const tokens = [];

      function walk(node, style) {
        if (node.nodeType === Node.TEXT_NODE) {
          for (const char of String(node.textContent || "")) {
            tokens.push({ char, style: { ...style } });
          }
          return;
        }
        if (node.nodeType !== Node.ELEMENT_NODE) return;

        const tag = node.tagName.toLowerCase();
        if (tag === "br") {
          tokens.push({ newline: true });
          return;
        }
        if (tag === "img") {
          const iconId = String(node.getAttribute("data-skill-icon") || "").trim();
          const icon = skillIconMap[iconId];
          if (icon) tokens.push({ iconId, iconLabel: icon.label, style: { ...style } });
          return;
        }

        const nextStyle = { ...style };
        if (tag === "i" || tag === "em") nextStyle.italic = true;
        if (tag === "u") nextStyle.underline = true;
        if (tag === "s" || tag === "strike" || tag === "del") nextStyle.strike = true;
        if (tag === "sup") nextStyle.script = "superscript";
        if (tag === "sub") nextStyle.script = "subscript";

        Array.from(node.childNodes).forEach((child) => walk(child, nextStyle));
      }

      Array.from(template.content.childNodes).forEach((child) => walk(child, { italic: false, underline: false, strike: false, script: "normal" }));
      while (tokens.length && tokens[tokens.length - 1].newline) tokens.pop();
      return tokens;
    }

    function htmlToPlainText(html) {
      return richHtmlToTokens(html).map((token) => token.newline ? "\n" : token.iconId ? `[${token.iconLabel}]` : token.char).join("");
    }

    function roundedRect(ctx, x, y, w, h, r) {
      const radius = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.arcTo(x + w, y, x + w, y + h, radius);
      ctx.arcTo(x + w, y + h, x, y + h, radius);
      ctx.arcTo(x, y + h, x, y, radius);
      ctx.arcTo(x, y, x + w, y, radius);
      ctx.closePath();
    }

    function drawCapsuleBase(ctx, image, x, y, w, h, fallbackColor, stretchInput = defaultCapsuleStretch()) {
      if (!image) {
        ctx.save();
        roundedRect(ctx, x, y, w, h, h / 2);
        const gradient = ctx.createLinearGradient(x, y, x + w, y + h);
        gradient.addColorStop(0, lighten(fallbackColor, 8));
        gradient.addColorStop(1, darken(fallbackColor, 8));
        ctx.fillStyle = gradient;
        ctx.fill();
        ctx.restore();
        return;
      }

      const metrics = getCapsuleStretchMetrics(image, h, stretchInput);
      if (!metrics) return;

      const destLeft = metrics.leftDestWidth;
      const destRight = metrics.rightDestWidth;
      const destMiddle = Math.max(0, w - destLeft - destRight);

      if (metrics.leftSourceWidth > 0 && destLeft > 0) {
        ctx.drawImage(image, 0, 0, metrics.leftSourceWidth, metrics.ih, x, y, destLeft, h);
      }

      if (destMiddle > 0) {
        const stretchWidth = metrics.stretchSourceWidth > 0 ? metrics.stretchSourceWidth : 1;
        const stretchX = metrics.stretchSourceWidth > 0
          ? metrics.leftSourceWidth
          : clamp(metrics.leftSourceWidth - 0.5, 0, Math.max(0, metrics.iw - 1));
        ctx.drawImage(image, stretchX, 0, stretchWidth, metrics.ih, x + destLeft, y, destMiddle, h);
      }

      if (metrics.rightSourceWidth > 0 && destRight > 0) {
        ctx.drawImage(image, metrics.rightSourceX, 0, metrics.rightSourceWidth, metrics.ih, x + destLeft + destMiddle, y, destRight, h);
      }
    }

    function getCapsuleTextBounds(image, x, w, h, stretchInput = defaultCapsuleStretch()) {
      const defaultInset = 16;
      const defaultRight = 28;
      return {
        left: x + defaultInset,
        right: x + w - defaultRight,
        leftCap: defaultInset,
        rightCap: defaultRight
      };
    }

    function clamp(value, min, max) {
      return Math.min(max, Math.max(min, value));
    }

    function getCropMetrics(imageWidth, imageHeight, cropInput = defaultCrop()) {
      const width = Math.max(1, Number(imageWidth) || 1);
      const height = Math.max(1, Number(imageHeight) || 1);
      const nextCrop = {
        x: Number(cropInput?.x ?? 50),
        y: Number(cropInput?.y ?? 50),
        size: clamp(Number(cropInput?.size ?? 70), 20, 100)
      };
      const sourceSize = Math.max(1, Math.min(width, height) * (nextCrop.size / 100));
      const half = sourceSize / 2;
      const minX = (half / width) * 100;
      const maxX = ((width - half) / width) * 100;
      const minY = (half / height) * 100;
      const maxY = ((height - half) / height) * 100;
      nextCrop.x = clamp(nextCrop.x, minX, maxX);
      nextCrop.y = clamp(nextCrop.y, minY, maxY);
      const centerX = width * (nextCrop.x / 100);
      const centerY = height * (nextCrop.y / 100);
      const sx = clamp(centerX - half, 0, width - sourceSize);
      const sy = clamp(centerY - half, 0, height - sourceSize);
      return { crop: nextCrop, sourceSize, sx, sy };
    }

    function normalizeRectCrop(cropInput = defaultRectCrop()) {
      const minSize = 6;
      const nextCrop = {
        x: Number(cropInput?.x ?? 10),
        y: Number(cropInput?.y ?? 10),
        w: Number(cropInput?.w ?? 80),
        h: Number(cropInput?.h ?? 80)
      };

      nextCrop.w = clamp(nextCrop.w, minSize, 100);
      nextCrop.h = clamp(nextCrop.h, minSize, 100);
      nextCrop.x = clamp(nextCrop.x, 0, 100 - nextCrop.w);
      nextCrop.y = clamp(nextCrop.y, 0, 100 - nextCrop.h);
      return nextCrop;
    }

    function normalizeCapsuleStretch(stretchInput = defaultCapsuleStretch()) {
      const nextStretch = {
        left: Number(stretchInput?.left ?? 33.3333),
        right: Number(stretchInput?.right ?? 66.6667)
      };
      nextStretch.left = clamp(nextStretch.left, 0, 100);
      nextStretch.right = clamp(nextStretch.right, nextStretch.left, 100);
      return nextStretch;
    }

    function getCapsuleStretchMinWidth(h, cropInput = defaultRectCrop(), stretchInput = defaultCapsuleStretch()) {
      const crop = normalizeRectCrop(cropInput);
      const stretch = normalizeCapsuleStretch(stretchInput);
      const aspect = crop.h > 0 ? crop.w / crop.h : 1;
      const fixedRatio = (stretch.left / 100) + ((100 - stretch.right) / 100);
      return h * aspect * fixedRatio;
    }

    function getRectCropMetrics(imageWidth, imageHeight, cropInput = defaultRectCrop()) {
      const width = Math.max(1, Number(imageWidth) || 1);
      const height = Math.max(1, Number(imageHeight) || 1);
      const crop = normalizeRectCrop(cropInput);
      const sx = width * (crop.x / 100);
      const sy = height * (crop.y / 100);
      const sourceWidth = Math.max(1, width * (crop.w / 100));
      const sourceHeight = Math.max(1, height * (crop.h / 100));
      return { crop, sx, sy, sourceWidth, sourceHeight };
    }

    function getCapsuleStretchMetrics(image, h, stretchInput = defaultCapsuleStretch()) {
      if (!image) return null;
      const iw = Math.max(1, Number(image.naturalWidth || image.width) || 1);
      const ih = Math.max(1, Number(image.naturalHeight || image.height) || 1);
      const stretch = normalizeCapsuleStretch(stretchInput);
      const leftSourceWidth = iw * (stretch.left / 100);
      const rightSourceX = iw * (stretch.right / 100);
      const rightSourceWidth = Math.max(0, iw - rightSourceX);
      const stretchSourceWidth = Math.max(0, rightSourceX - leftSourceWidth);
      const scale = h / ih;
      return {
        stretch,
        iw,
        ih,
        leftSourceWidth,
        stretchSourceWidth,
        rightSourceX,
        rightSourceWidth,
        leftDestWidth: leftSourceWidth * scale,
        rightDestWidth: rightSourceWidth * scale,
        minWidth: leftSourceWidth * scale + rightSourceWidth * scale
      };
    }

    function loadImage(src) {
      if (!src) return Promise.resolve(null);
      if (imageCache.has(src)) return imageCache.get(src);

      const promise = new Promise((resolve) => {
        const image = new Image();
        if (/^https?:/i.test(src)) image.crossOrigin = "anonymous";
        image.onload = () => resolve(image);
        image.onerror = () => resolve(null);
        image.src = src;
      });

      imageCache.set(src, promise);
      return promise;
    }

    async function setRoleAvatarSource(role, source, options = {}) {
      const next = String(source || "").trim();
      const shouldResetCrop = Boolean(options.resetCrop);
      if (Object.prototype.hasOwnProperty.call(options, "avatarInput")) {
        role.avatarInput = options.avatarInput;
      }
      if (Object.prototype.hasOwnProperty.call(options, "fileLabel")) {
        role.fileLabel = options.fileLabel;
      }

      role.avatarOriginal = next;
      if (!next) {
        role.avatar = "";
        role.crop = defaultCrop();
        return;
      }

      if (!role.crop || shouldResetCrop) {
        role.crop = defaultCrop();
      }

      await applyRoleCrop(role);
    }

    function scheduleCropOverlaySync() {
      requestAnimationFrame(() => {
        document.querySelectorAll("[data-role-id]").forEach((card) => {
          const role = roleById(card.dataset.roleId);
          if (role) updateRoleCropUI(card, role);
        });
      });
    }

    function updateRoleCropUI(card, role) {
      if (!card || !role) return;

      const preview = card.querySelector('[data-field="crop-preview"]');
      const mini = card.querySelector(".avatar-mini");
      const overlay = card.querySelector('[data-field="crop-overlay"]');
      const stage = card.querySelector('[data-field="crop-stage"]');
      const source = card.querySelector('[data-field="crop-source"]');

      if (preview) preview.src = role.avatar || role.avatarOriginal || preview.src;
      if (mini && role.avatar) mini.src = role.avatar;

      const xInput = card.querySelector('[data-field="crop-x"]');
      const yInput = card.querySelector('[data-field="crop-y"]');
      const sizeInput = card.querySelector('[data-field="crop-size"]');
      const sizeValue = card.querySelector('[data-field="crop-size-value"]');
      if (xInput) xInput.value = String(Math.round(role.crop?.x ?? 50));
      if (yInput) yInput.value = String(Math.round(role.crop?.y ?? 50));
      if (sizeInput) sizeInput.value = String(Math.round(role.crop?.size ?? 70));
      if (sizeValue) sizeValue.textContent = `${Math.round(role.crop?.size ?? 70)}%`;

      if (!overlay || !stage || !source) return;
      if (!source.complete || !source.naturalWidth || !source.naturalHeight) {
        overlay.style.display = "none";
        source.onload = () => updateRoleCropUI(card, role);
        return;
      }

      const stageWidth = stage.clientWidth;
      const stageHeight = stage.clientHeight;
      if (!stageWidth || !stageHeight) return;

      const scale = Math.min(stageWidth / source.naturalWidth, stageHeight / source.naturalHeight);
      const displayWidth = source.naturalWidth * scale;
      const displayHeight = source.naturalHeight * scale;
      const offsetX = (stageWidth - displayWidth) / 2;
      const offsetY = (stageHeight - displayHeight) / 2;
      const metrics = getCropMetrics(source.naturalWidth, source.naturalHeight, role.crop);
      role.crop = metrics.crop;

      overlay.style.display = "block";
      overlay.style.left = `${offsetX + metrics.sx * scale}px`;
      overlay.style.top = `${offsetY + metrics.sy * scale}px`;
      overlay.style.width = `${metrics.sourceSize * scale}px`;
      overlay.style.height = `${metrics.sourceSize * scale}px`;
    }

    function requestRoleCropUpdate(role, card) {
      role._cropRevision = (role._cropRevision || 0) + 1;
      const revision = role._cropRevision;
      applyRoleCrop(role).then(() => {
        if (role._cropRevision !== revision) return;
        if (card?.isConnected) updateRoleCropUI(card, role);
        draw();
      });
    }

    function updateRoleCropFromPointer(card, clientX, clientY) {
      const role = roleById(card?.dataset.roleId);
      const stage = card?.querySelector('[data-field="crop-stage"]');
      const source = card?.querySelector('[data-field="crop-source"]');
      if (!role || !stage || !source?.naturalWidth || !source?.naturalHeight) return;

      const rect = stage.getBoundingClientRect();
      const stageWidth = stage.clientWidth;
      const stageHeight = stage.clientHeight;
      const scale = Math.min(stageWidth / source.naturalWidth, stageHeight / source.naturalHeight);
      const displayWidth = source.naturalWidth * scale;
      const displayHeight = source.naturalHeight * scale;
      const offsetX = (stageWidth - displayWidth) / 2;
      const offsetY = (stageHeight - displayHeight) / 2;
      const localX = clamp(clientX - rect.left, offsetX, offsetX + displayWidth);
      const localY = clamp(clientY - rect.top, offsetY, offsetY + displayHeight);

      role.crop = role.crop || defaultCrop();
      role.crop.x = ((localX - offsetX) / displayWidth) * 100;
      role.crop.y = ((localY - offsetY) / displayHeight) * 100;
      requestRoleCropUpdate(role, card);
    }

    async function applyRoleCrop(role) {
      if (!role?.avatarOriginal) return;
      const image = await loadImage(role.avatarOriginal);
      if (!image) {
        role.avatar = role.avatarOriginal;
        return;
      }

      const canvas = document.createElement("canvas");
      const size = 512;
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext("2d");
      const metrics = getCropMetrics(image.naturalWidth || image.width, image.naturalHeight || image.height, role.crop);
      role.crop = metrics.crop;
      ctx.drawImage(image, metrics.sx, metrics.sy, metrics.sourceSize, metrics.sourceSize, 0, 0, size, size);
      role.avatar = canvas.toDataURL("image/png");
    }

    function renderCapsuleCropEditor() {
      const host = $("capsuleCropEditor");
      if (!host) return;
      if (!state.capsuleImageOriginal) {
        host.innerHTML = "";
        return;
      }

      const crop = state.capsuleCrop || defaultRectCrop();
      host.innerHTML = `
        <div class="crop-shell is-capsule-crop${state.capsuleStretchEditing ? " is-stretch-editing" : ""}">
          <div class="crop-top">
            <div class="crop-stage" data-field="capsule-crop-stage">
              <img class="crop-source" data-field="capsule-crop-source" src="${escapeAttr(state.capsuleImageOriginal)}" alt="">
              <div class="crop-box" data-field="capsule-crop-box">
                <div class="crop-handle" data-handle="nw"></div>
                <div class="crop-handle" data-handle="ne"></div>
                <div class="crop-handle" data-handle="sw"></div>
                <div class="crop-handle" data-handle="se"></div>
              </div>
              <div class="crop-stretch-guide" data-field="capsule-stretch-guide">
                <div class="crop-stretch-window" data-field="capsule-stretch-window"></div>
                <div class="crop-stretch-line" data-field="capsule-stretch-left" data-stretch-handle="left"></div>
                <div class="crop-stretch-line" data-field="capsule-stretch-right" data-stretch-handle="right"></div>
              </div>
            </div>
          </div>
          <div class="crop-controls">
            <p class="hint crop-meta">${state.capsuleStretchEditing ? "拖动两条竖线选择可拉伸单元；裁剪框会暂时锁定，完成后再继续裁剪。" : "直接拖动裁剪框，或者拉动四角调整范围。下面的宽高百分比也可以直接输入。"}</p>
            <div class="crop-meta-inputs">
              <input type="number" min="6" max="100" step="1" data-field="capsule-crop-w" value="${Math.round(crop.w ?? 80)}">
              <span>%</span>
              <input type="number" min="6" max="100" step="1" data-field="capsule-crop-h" value="${Math.round(crop.h ?? 80)}">
              <span>%</span>
            </div>
            <div class="actions">
              <button type="button" data-action="center-capsule-crop">居中取景</button>
              <button type="button" data-action="reset-capsule-crop">重置裁剪</button>
              <button type="button" data-action="toggle-capsule-stretch">${state.capsuleStretchEditing ? "完成" : "拉伸单元自定义"}</button>
            </div>
          </div>
        </div>
      `;

      updateCapsuleCropUI();
    }

    function updateCapsuleCropUI() {
      const host = $("capsuleCropEditor");
      if (!host || !state.capsuleImageOriginal) return;

      const shell = host.querySelector(".crop-shell.is-capsule-crop");
      const cropBox = host.querySelector('[data-field="capsule-crop-box"]');
      const stretchGuide = host.querySelector('[data-field="capsule-stretch-guide"]');
      const stretchWindow = host.querySelector('[data-field="capsule-stretch-window"]');
      const stretchLeftLine = host.querySelector('[data-field="capsule-stretch-left"]');
      const stretchRightLine = host.querySelector('[data-field="capsule-stretch-right"]');
      const stage = host.querySelector('[data-field="capsule-crop-stage"]');
      const source = host.querySelector('[data-field="capsule-crop-source"]');
      const widthInput = host.querySelector('[data-field="capsule-crop-w"]');
      const heightInput = host.querySelector('[data-field="capsule-crop-h"]');

      if (!cropBox || !stage || !source) return;
      if (!source.complete || !source.naturalWidth || !source.naturalHeight) {
        cropBox.style.display = "none";
        source.onload = () => updateCapsuleCropUI();
        return;
      }

      const stageWidth = stage.clientWidth;
      const stageHeight = stage.clientHeight;
      if (!stageWidth || !stageHeight) return;

      const scale = Math.min(stageWidth / source.naturalWidth, stageHeight / source.naturalHeight);
      const displayWidth = source.naturalWidth * scale;
      const displayHeight = source.naturalHeight * scale;
      const offsetX = (stageWidth - displayWidth) / 2;
      const offsetY = (stageHeight - displayHeight) / 2;
      const metrics = getRectCropMetrics(source.naturalWidth, source.naturalHeight, state.capsuleCrop);
      state.capsuleCrop = metrics.crop;
      state.capsuleStretch = normalizeCapsuleStretch(state.capsuleStretch || defaultCapsuleStretch());

      if (shell) shell.classList.toggle("is-stretch-editing", Boolean(state.capsuleStretchEditing));
      cropBox.style.display = "block";
      cropBox.style.left = `${offsetX + metrics.sx * scale}px`;
      cropBox.style.top = `${offsetY + metrics.sy * scale}px`;
      cropBox.style.width = `${metrics.sourceWidth * scale}px`;
      cropBox.style.height = `${metrics.sourceHeight * scale}px`;

      if (stretchGuide && stretchWindow && stretchLeftLine && stretchRightLine) {
        const cropLeft = offsetX + metrics.sx * scale;
        const cropTop = offsetY + metrics.sy * scale;
        const cropWidth = metrics.sourceWidth * scale;
        const cropHeight = metrics.sourceHeight * scale;
        const stretch = state.capsuleStretch;
        const leftPx = cropWidth * (stretch.left / 100);
        const rightPx = cropWidth * (stretch.right / 100);
        stretchGuide.style.left = `${cropLeft}px`;
        stretchGuide.style.top = `${cropTop}px`;
        stretchGuide.style.width = `${cropWidth}px`;
        stretchGuide.style.height = `${cropHeight}px`;
        stretchLeftLine.style.left = `${leftPx}px`;
        stretchRightLine.style.left = `${rightPx}px`;
        stretchWindow.style.left = `${leftPx}px`;
        stretchWindow.style.width = `${Math.max(0, rightPx - leftPx)}px`;
      }

      if (widthInput) widthInput.value = String(Math.round(metrics.crop.w));
      if (heightInput) heightInput.value = String(Math.round(metrics.crop.h));
    }

    function requestCapsuleCropUpdate() {
      state._capsuleCropRevision = (state._capsuleCropRevision || 0) + 1;
      const revision = state._capsuleCropRevision;
      applyCapsuleCrop().then(() => {
        if (state._capsuleCropRevision !== revision) return;
        updateCapsuleCropUI();
        draw();
      });
    }

    function getCapsuleCropStageMetrics() {
      const host = $("capsuleCropEditor");
      const stage = host?.querySelector('[data-field="capsule-crop-stage"]');
      const source = host?.querySelector('[data-field="capsule-crop-source"]');
      if (!stage || !source?.naturalWidth || !source?.naturalHeight) return null;

      const stageWidth = stage.clientWidth;
      const stageHeight = stage.clientHeight;
      const scale = Math.min(stageWidth / source.naturalWidth, stageHeight / source.naturalHeight);
      const displayWidth = source.naturalWidth * scale;
      const displayHeight = source.naturalHeight * scale;
      const offsetX = (stageWidth - displayWidth) / 2;
      const offsetY = (stageHeight - displayHeight) / 2;
      return {
        stage,
        rect: stage.getBoundingClientRect(),
        displayWidth,
        displayHeight,
        offsetX,
        offsetY
      };
    }

    function getCapsuleCropPointerPercent(clientX, clientY) {
      const metrics = getCapsuleCropStageMetrics();
      if (!metrics) return null;
      const localX = clamp(clientX - metrics.rect.left, metrics.offsetX, metrics.offsetX + metrics.displayWidth);
      const localY = clamp(clientY - metrics.rect.top, metrics.offsetY, metrics.offsetY + metrics.displayHeight);
      return {
        x: ((localX - metrics.offsetX) / metrics.displayWidth) * 100,
        y: ((localY - metrics.offsetY) / metrics.displayHeight) * 100
      };
    }

    function getCapsuleStretchPointerPercent(clientX) {
      const host = $("capsuleCropEditor");
      const guide = host?.querySelector('[data-field="capsule-stretch-guide"]');
      if (!guide) return null;
      const rect = guide.getBoundingClientRect();
      if (!rect.width) return null;
      const localX = clamp(clientX - rect.left, 0, rect.width);
      return (localX / rect.width) * 100;
    }

    function updateCapsuleStretchFromDrag(clientX) {
      if (!activeCapsuleCropDrag) return;
      const pointerX = getCapsuleStretchPointerPercent(clientX);
      if (pointerX == null) return;
      const startStretch = normalizeCapsuleStretch(activeCapsuleCropDrag.startStretch || defaultCapsuleStretch());
      let nextStretch = { ...startStretch };

      if (activeCapsuleCropDrag.mode === "stretch-left") {
        nextStretch.left = clamp(pointerX, 0, startStretch.right);
      }
      if (activeCapsuleCropDrag.mode === "stretch-right") {
        nextStretch.right = clamp(pointerX, startStretch.left, 100);
      }

      state.capsuleStretch = normalizeCapsuleStretch(nextStretch);
      updateCapsuleCropUI();
      draw();
    }

    function updateCapsuleCropFromDrag(clientX, clientY) {
      if (!activeCapsuleCropDrag) return;
      const pointer = getCapsuleCropPointerPercent(clientX, clientY);
      if (!pointer) return;

      const minSize = 6;
      const startCrop = activeCapsuleCropDrag.startCrop;
      let nextCrop = { ...startCrop };

      if (activeCapsuleCropDrag.mode === "move") {
        nextCrop.x = clamp(startCrop.x + (pointer.x - activeCapsuleCropDrag.startPoint.x), 0, 100 - startCrop.w);
        nextCrop.y = clamp(startCrop.y + (pointer.y - activeCapsuleCropDrag.startPoint.y), 0, 100 - startCrop.h);
      } else {
        let left = startCrop.x;
        let top = startCrop.y;
        let right = startCrop.x + startCrop.w;
        let bottom = startCrop.y + startCrop.h;

        if (activeCapsuleCropDrag.mode.includes("w")) left = clamp(pointer.x, 0, right - minSize);
        if (activeCapsuleCropDrag.mode.includes("e")) right = clamp(pointer.x, left + minSize, 100);
        if (activeCapsuleCropDrag.mode.includes("n")) top = clamp(pointer.y, 0, bottom - minSize);
        if (activeCapsuleCropDrag.mode.includes("s")) bottom = clamp(pointer.y, top + minSize, 100);

        nextCrop = {
          x: left,
          y: top,
          w: right - left,
          h: bottom - top
        };
      }

      state.capsuleCrop = normalizeRectCrop(nextCrop);
      updateCapsuleCropUI();
      requestCapsuleCropUpdate();
    }

    async function setCapsuleImageSource(source, options = {}) {
      const next = String(source || "").trim();
      state.capsuleImageOriginal = next;
      if (Object.prototype.hasOwnProperty.call(options, "fileLabel")) {
        state.capsuleImageLabel = options.fileLabel;
      }
      if (!next) {
        state.capsuleImage = "";
        state.capsuleCrop = defaultRectCrop();
        state.capsuleStretch = defaultCapsuleStretch();
        state.capsuleStretchEditing = false;
        state.capsuleImageLabel = "";
        renderCapsuleCropEditor();
        return;
      }

      if (!state.capsuleCrop || options.resetCrop) {
        state.capsuleCrop = defaultRectCrop();
      }
      if (!state.capsuleStretch || options.resetCrop) {
        state.capsuleStretch = defaultCapsuleStretch();
      }

      await applyCapsuleCrop();
      renderCapsuleCropEditor();
    }

    async function applyCapsuleCrop() {
      if (!state.capsuleImageOriginal) return;
      const image = await loadImage(state.capsuleImageOriginal);
      if (!image) {
        state.capsuleImage = state.capsuleImageOriginal;
        return;
      }

      const metrics = getRectCropMetrics(image.naturalWidth || image.width, image.naturalHeight || image.height, state.capsuleCrop);
      state.capsuleCrop = metrics.crop;

      const outputWidth = 1200;
      const outputHeight = Math.max(120, Math.round(outputWidth * (metrics.sourceHeight / metrics.sourceWidth)));
      const canvas = document.createElement("canvas");
      canvas.width = outputWidth;
      canvas.height = outputHeight;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(image, metrics.sx, metrics.sy, metrics.sourceWidth, metrics.sourceHeight, 0, 0, outputWidth, outputHeight);
      state.capsuleImage = canvas.toDataURL("image/png");
    }

    function buildDrawSettings(overrides = {}) {
      return {
        mode: state.layoutMode,
        flowSizeLock: $("flowSizeLock")?.checked === true,
        x: readNumber("capsuleX"),
        y: readNumber("capsuleY"),
        w: readNumber("capsuleWidth"),
        h: readNumber("capsuleHeight"),
        gap: readNumber("capsuleGap"),
        gapX: readNumber("capsuleGapX"),
        rightPad: readNumber("capsuleRightPad"),
        widthMode: $("capsuleWidthMode").value,
        color: $("capsuleColor").value,
        avatar: readNumber("avatarSize"),
        avatarScale: Math.max(0.1, readNumber("avatarScale") / 100),
        avatarInset: readNumber("avatarInset"),
        avatarOffsetY: readNumber("avatarOffsetY"),
        textInset: readNumber("textInset"),
        noAvatarTextInset: readNumber("noAvatarTextInset"),
        textAlign: $("textAlign").value,
        fontFamily: $("fontFamily").value,
        fontSize: readNumber("fontSize"),
        fontColor: $("fontColor").value,
        fontWeight: $("fontWeight").value,
        ...overrides
      };
    }

    function getSkillPlacements(ctx, settings, canvasWidth, skills = state.skills) {
      const avatarSize = Math.max(12, settings.avatar * settings.avatarScale);
      const placements = [];
      let cursorX = settings.x;
      let cursorY = settings.y;
      let maxRight = settings.x;
      let maxBottom = settings.y;

      skills.forEach((skill, index) => {
        const role = roleById(skill.roleId);
        const hasAvatar = Boolean(role);
        const capsuleWidth = getCapsuleWidth(ctx, skill, settings, avatarSize, hasAvatar);
        let x = settings.x;
        let y = cursorY;

        if (settings.mode === "horizontal") {
          x = cursorX;
          y = cursorY;
        } else if (settings.mode === "flow") {
          const wrapRight = Math.max(settings.x + capsuleWidth, canvasWidth - settings.x);
          if (cursorX > settings.x && cursorX + capsuleWidth > wrapRight) {
            cursorX = settings.x;
            cursorY += settings.h + settings.gap;
          }
          x = cursorX;
          y = cursorY;
        } else {
          x = settings.x;
          y = cursorY;
        }

        maxRight = Math.max(maxRight, x + capsuleWidth);
        maxBottom = Math.max(maxBottom, y + settings.h);
        placements.push({ skill, role, hasAvatar, capsuleWidth, x, y });

        if (settings.mode === "horizontal") {
          if (skill.forceBreakBefore) {
            cursorX = settings.x;
            cursorY += settings.h + settings.gap;
          } else {
            cursorX += capsuleWidth + settings.gapX;
          }
        } else if (settings.mode === "flow") {
          if (skill.forceBreakBefore) {
            cursorX = settings.x;
            cursorY += settings.h + settings.gap;
          } else {
            cursorX += capsuleWidth + settings.gapX;
          }
        } else {
          cursorY += settings.h + settings.gap;
          if (skill.forceBreakBefore) {
            cursorY += settings.h + settings.gap;
          }
        }
      });

      return {
        avatarSize,
        placements,
        contentWidth: placements.length ? maxRight + settings.x : settings.x * 2 + settings.w,
        contentHeight: placements.length ? maxBottom + settings.y : settings.y * 2 + settings.h
      };
    }

    function scaleLayoutSettings(settings, factor) {
      const scale = Math.max(0.05, Number(factor) || 1);
      return {
        ...settings,
        x: settings.x * scale,
        y: settings.y * scale,
        w: settings.w * scale,
        h: settings.h * scale,
        gap: settings.gap * scale,
        gapX: settings.gapX * scale,
        rightPad: settings.rightPad * scale,
        avatar: settings.avatar * scale,
        avatarInset: settings.avatarInset * scale,
        avatarOffsetY: settings.avatarOffsetY * scale,
        textInset: settings.textInset * scale,
        noAvatarTextInset: settings.noAvatarTextInset * scale,
        fontSize: settings.fontSize * scale
      };
    }

    function solveFlowLockedScale(ctx, settings, width, height) {
      let low = 0.05;
      let high = 1;
      let best = low;

      for (let i = 0; i < 18; i += 1) {
        const mid = (low + high) / 2;
        const scaled = scaleLayoutSettings(settings, mid);
        const metrics = getSkillPlacements(ctx, scaled, width);
        if (metrics.contentHeight <= height + 0.5) {
          best = mid;
          low = mid;
        } else {
          high = mid;
        }
      }

      return best;
    }

    async function drawSkillPlacement(ctx, placement, settings, capsuleImage, avatarSize) {
      const { skill, role, hasAvatar, capsuleWidth, x, y } = placement;
      drawCapsuleBase(ctx, capsuleImage, x, y, capsuleWidth, settings.h, settings.color, state.capsuleStretch);

      const avatarX = x + settings.avatarInset;
      const avatarY = y + (settings.h - avatarSize) / 2 + settings.avatarOffsetY;
      const avatarImage = await loadImage(role?.avatar || "");

      if (avatarImage) {
        ctx.save();
        ctx.beginPath();
        ctx.arc(avatarX + avatarSize / 2, avatarY + avatarSize / 2, avatarSize / 2, 0, Math.PI * 2);
        ctx.clip();
        ctx.drawImage(avatarImage, avatarX, avatarY, avatarSize, avatarSize);
        ctx.restore();
      } else if (role) {
        ctx.save();
        ctx.fillStyle = "#dce8e9";
        ctx.beginPath();
        ctx.arc(avatarX + avatarSize / 2, avatarY + avatarSize / 2, avatarSize / 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#2f3948";
        ctx.font = `900 ${Math.max(18, avatarSize * .36)}px ${settings.fontFamily}`;
        ctx.textAlign = "center";
        ctx.fillText((role.name || "?").slice(0, 1), avatarX + avatarSize / 2, avatarY + avatarSize / 2 + 2);
        ctx.restore();
      }

      if (role) {
        ctx.save();
        ctx.strokeStyle = "#384244";
        ctx.lineWidth = Math.max(4, avatarSize * .07);
        ctx.beginPath();
        ctx.arc(avatarX + avatarSize / 2, avatarY + avatarSize / 2, avatarSize / 2 - ctx.lineWidth / 2, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }

      ctx.save();
      ctx.fillStyle = settings.fontColor;
      const textBounds = getCapsuleTextBounds(capsuleImage, x, capsuleWidth, settings.h, state.capsuleStretch);
      const textLeftBound = textBounds.left;
      const textRightBound = textBounds.right;
      const textInset = hasAvatar ? settings.textInset : settings.noAvatarTextInset;
      const textAnchorX = clamp(x + textInset, textLeftBound, textRightBound);
      const textMaxWidth = getTextMaxWidth(textAnchorX, textLeftBound, textRightBound, settings.textAlign);
      await fitText(ctx, getSkillRichHtml(skill), textAnchorX, y + settings.h / 2, textMaxWidth, settings.fontSize, settings.textAlign, settings);
      ctx.restore();
    }

    function getCapsuleExportBounds(settings, capsuleWidth, hasAvatar, avatarSize) {
      if (!hasAvatar) {
        return { left: 0, top: 0, width: capsuleWidth, height: settings.h };
      }

      const padding = 8;
      const avatarLeft = settings.avatarInset;
      const avatarTop = (settings.h - avatarSize) / 2 + settings.avatarOffsetY;
      const avatarRight = avatarLeft + avatarSize;
      const avatarBottom = avatarTop + avatarSize;
      const left = Math.min(0, avatarLeft - padding);
      const top = Math.min(0, avatarTop - padding);
      const right = Math.max(capsuleWidth, avatarRight + padding);
      const bottom = Math.max(settings.h, avatarBottom + padding);
      return {
        left,
        top,
        width: Math.ceil(right - left),
        height: Math.ceil(bottom - top)
      };
    }

    function canvasToBlob(canvas) {
      return new Promise((resolve, reject) => {
        canvas.toBlob((blob) => {
          if (blob) resolve(blob);
          else reject(new Error("canvas_to_blob_failed"));
        }, "image/png");
      });
    }

    function saveBlobAsDownload(blob, fileName) {
      const link = document.createElement("a");
      const url = URL.createObjectURL(blob);
      link.download = fileName;
      link.href = url;
      link.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function createTimestampLabel() {
      const now = new Date();
      const pad = (value) => String(value).padStart(2, "0");
      return `${now.getFullYear()}${pad(now.getMonth() + 1)}${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}`;
    }

    async function draw() {
      const canvas = $("output");
      const ctx = canvas.getContext("2d");
      const width = Math.max(100, readNumber("canvasWidth"));
      const height = Math.max(100, readNumber("canvasHeight"));
      const scale = Number($("scale").value) || 1;

      canvas.width = width;
      canvas.height = height;
      canvas.style.width = `${Math.round(width * scale)}px`;
      canvas.style.height = `${Math.round(height * scale)}px`;

      ctx.clearRect(0, 0, width, height);

      let settings = buildDrawSettings();
      ctx.textBaseline = "middle";
      ctx.textAlign = "left";
      const capsuleImage = await loadImage(state.capsuleImage);
      if (settings.mode === "flow" && settings.flowSizeLock) {
        const scaleFactor = solveFlowLockedScale(ctx, settings, width, height);
        settings = scaleLayoutSettings(settings, scaleFactor);
      }
      const { avatarSize, placements } = getSkillPlacements(ctx, settings, width);

      for (const placement of placements) {
        await drawSkillPlacement(ctx, placement, settings, capsuleImage, avatarSize);
      }

      updateCapsuleCropUI();
    }

    function getTokenDrawStyle(baseStyle, inlineStyle = {}) {
      const script = inlineStyle.script || "normal";
      const scriptScale = script === "normal" ? 1 : 0.76;
      const fontSize = Math.max(8, baseStyle.fontSize * scriptScale);
      return {
        font: `${inlineStyle.italic ? "italic " : ""}${baseStyle.fontWeight} ${fontSize}px ${baseStyle.fontFamily}`,
        fontSize,
        scriptOffset: script === "superscript"
          ? -baseStyle.fontSize * 0.24
          : script === "subscript"
            ? baseStyle.fontSize * 0.2
            : 0,
        underline: Boolean(inlineStyle.underline),
        strike: Boolean(inlineStyle.strike)
      };
    }

    function measureRichLineWidth(ctx, tokens, settings) {
      let width = 0;
      tokens.forEach((token) => {
        if (token.newline) return;
        if (token.iconId) {
          width += getSkillIconMetrics(settings).width;
          return;
        }
        const style = getTokenDrawStyle(settings, token.style);
        ctx.font = style.font;
        width += ctx.measureText(token.char).width;
      });
      return width;
    }

    function measureRichTextMaxLineWidth(ctx, html, settings) {
      const tokens = richHtmlToTokens(html);
      let currentLine = [];
      let maxWidth = 0;

      tokens.forEach((token) => {
        if (token.newline) {
          maxWidth = Math.max(maxWidth, measureRichLineWidth(ctx, currentLine, settings));
          currentLine = [];
          return;
        }
        currentLine.push(token);
      });

      maxWidth = Math.max(maxWidth, measureRichLineWidth(ctx, currentLine, settings));
      return maxWidth;
    }

    function getCapsuleWidth(ctx, skill, settings, avatarSize, hasAvatar) {
      if (!isHorizontalFamilyMode(settings.mode) || settings.widthMode === "fixed") {
        return settings.w;
      }

      ctx.save();
      const textWidth = Math.ceil(measureRichTextMaxLineWidth(ctx, getSkillRichHtml(skill), settings));
      ctx.restore();

      const textAnchorOffset = Math.max(0, hasAvatar ? settings.textInset : settings.noAvatarTextInset);
      const textLeft = settings.textAlign === "left" ? textAnchorOffset : settings.textAlign === "center" ? textAnchorOffset - textWidth / 2 : textAnchorOffset - textWidth;
      const textRight = settings.textAlign === "left" ? textAnchorOffset + textWidth : settings.textAlign === "center" ? textAnchorOffset + textWidth / 2 : textAnchorOffset;
      const avatarReach = hasAvatar ? settings.avatarInset + avatarSize : 0;
      const contentRight = Math.max(avatarReach, textRight);
      const contentLeft = Math.max(16, Math.min(hasAvatar ? settings.avatarInset : 16, textLeft));
      const minCapsuleWidth = state.capsuleImage
        ? getCapsuleStretchMinWidth(settings.h, state.capsuleCrop, state.capsuleStretch)
        : settings.h + 24;
      const autoWidth = Math.ceil(Math.max(minCapsuleWidth, contentRight + settings.rightPad, contentLeft + textWidth + settings.rightPad));
      return autoWidth;
    }

    function getTextMaxWidth(anchorX, leftBound, rightBound, align) {
      if (align === "right") return Math.max(0, anchorX - leftBound);
      if (align === "center") return Math.max(0, Math.min(anchorX - leftBound, rightBound - anchorX) * 2);
      return Math.max(0, rightBound - anchorX);
    }

    async function fitText(ctx, html, x, y, maxWidth, fontSize, align = "left", settings = {}) {
      const tokens = richHtmlToTokens(html);
      if (!tokens.length) return;

      const safeMaxWidth = Math.max(20, maxWidth);
      const preferredSingleLine = settings.mode === "flow" && settings.flowSizeLock === true;
      const iconMetrics = getSkillIconMetrics(settings);
      const lines = [];
      let currentLine = [];
      let currentWidth = 0;

      tokens.forEach((token) => {
        if (token.newline) {
          lines.push({ tokens: currentLine, width: currentWidth });
          currentLine = [];
          currentWidth = 0;
          return;
        }

        const drawStyle = getTokenDrawStyle(settings, token.style);
        let tokenWidth = 0;
        if (token.iconId) {
          tokenWidth = iconMetrics.width;
        } else {
          ctx.font = drawStyle.font;
          tokenWidth = ctx.measureText(token.char).width;
        }

        if (!preferredSingleLine && currentLine.length && currentWidth + tokenWidth > safeMaxWidth) {
          lines.push({ tokens: currentLine, width: currentWidth });
          currentLine = [];
          currentWidth = 0;
        }

        currentLine.push({ ...token, width: tokenWidth, drawStyle });
        currentWidth += tokenWidth;
      });

      lines.push({ tokens: currentLine, width: currentWidth });

      const lineHeight = Math.max(fontSize * 1.08, iconMetrics.size + 6);
      const startY = y - ((lines.length - 1) * lineHeight) / 2;

      for (const [index, line] of lines.entries()) {
        const lineY = startY + index * lineHeight;
        const lineScaleX = preferredSingleLine && line.width > safeMaxWidth
          ? safeMaxWidth / Math.max(line.width, 1)
          : 1;
        const visibleLineWidth = line.width * lineScaleX;
        let cursorX = align === "left" ? x : align === "center" ? x - visibleLineWidth / 2 : x - visibleLineWidth;

        for (const token of line.tokens) {
          const visibleTokenWidth = token.width * lineScaleX;
          ctx.save();
          if (lineScaleX !== 1) {
            ctx.translate(cursorX, 0);
            ctx.scale(lineScaleX, 1);
          }

          if (token.iconId) {
            const icon = skillIconMap[token.iconId];
            const iconImage = icon ? await loadImage(icon.src) : null;
            if (iconImage) {
              const iconX = lineScaleX !== 1 ? iconMetrics.gap : cursorX + iconMetrics.gap;
              ctx.drawImage(iconImage, iconX, lineY - iconMetrics.size / 2, iconMetrics.size, iconMetrics.size);
            }
          } else {
            ctx.font = token.drawStyle.font;
            ctx.fillText(token.char, lineScaleX !== 1 ? 0 : cursorX, lineY + token.drawStyle.scriptOffset);

            if (token.drawStyle.underline || token.drawStyle.strike) {
              ctx.strokeStyle = ctx.fillStyle;
              ctx.lineWidth = Math.max(1.5, token.drawStyle.fontSize * 0.06);
              if (token.drawStyle.underline) {
                const underlineY = lineY + token.drawStyle.scriptOffset + token.drawStyle.fontSize * 0.42;
                ctx.beginPath();
                ctx.moveTo(lineScaleX !== 1 ? 0 : cursorX, underlineY);
                ctx.lineTo((lineScaleX !== 1 ? 0 : cursorX) + token.width, underlineY);
                ctx.stroke();
              }
              if (token.drawStyle.strike) {
                const strikeY = lineY + token.drawStyle.scriptOffset - token.drawStyle.fontSize * 0.12;
                ctx.beginPath();
                ctx.moveTo(lineScaleX !== 1 ? 0 : cursorX, strikeY);
                ctx.lineTo((lineScaleX !== 1 ? 0 : cursorX) + token.width, strikeY);
                ctx.stroke();
              }
            }
          }
          ctx.restore();

          cursorX += visibleTokenWidth;
        }
      }
    }

    function hexToRgb(hex) {
      const value = hex.replace("#", "");
      return {
        r: parseInt(value.slice(0, 2), 16),
        g: parseInt(value.slice(2, 4), 16),
        b: parseInt(value.slice(4, 6), 16)
      };
    }

    function toHex({ r, g, b }) {
      return "#" + [r, g, b].map((value) => Math.max(0, Math.min(255, Math.round(value))).toString(16).padStart(2, "0")).join("");
    }

    function lighten(hex, amount) {
      const rgb = hexToRgb(hex);
      return toHex({ r: rgb.r + amount, g: rgb.g + amount, b: rgb.b + amount });
    }

    function darken(hex, amount) {
      return lighten(hex, -amount);
    }

    function fitCanvasToContent() {
      const ctx = $("output").getContext("2d");
      ctx.save();
      const settings = buildDrawSettings();
      if (state.layoutMode === "horizontal") {
        const metrics = getSkillPlacements(ctx, settings, Number.MAX_SAFE_INTEGER);
        $("canvasWidth").value = Math.max(1600, Math.ceil(metrics.contentWidth));
        $("canvasHeight").value = Math.ceil(metrics.contentHeight);
      } else if (state.layoutMode === "flow") {
        if (!settings.flowSizeLock) {
          const metrics = getSkillPlacements(ctx, settings, Math.max(100, readNumber("canvasWidth")));
          $("canvasHeight").value = Math.ceil(metrics.contentHeight);
        }
      } else {
        const metrics = getSkillPlacements(ctx, settings, Math.max(100, readNumber("canvasWidth")));
        $("canvasHeight").value = Math.ceil(metrics.contentHeight);
      }
      ctx.restore();
      draw();
    }

    function resetDemo() {
      state.capsuleImage = "";
      state.capsuleImageOriginal = "";
      state.capsuleCrop = defaultRectCrop();
      state.capsuleStretch = defaultCapsuleStretch();
      state.capsuleStretchEditing = false;
      state.capsuleImageLabel = "";
      state.roles = [
        { id: uid(), name: "维里奈", avatar: demoImages[0], avatarOriginal: demoImages[0], avatarInput: "", crop: defaultCrop() },
        { id: uid(), name: "吟霖", avatar: demoImages[1], avatarOriginal: demoImages[1], avatarInput: "", crop: defaultCrop() }
      ];
      state.skills = [
        { id: uid(), roleId: state.roles[0].id, text: "AAER" },
        { id: uid(), roleId: "", text: "" },
        { id: uid(), roleId: state.roles[1].id, text: "开大" },
        { id: uid(), roleId: "", text: "开大" }
      ];
      renderEditors();
      draw();
    }

    function downloadPng() {
      draw().then(() => {
        const canvas = $("output");
        const link = document.createElement("a");
        link.download = "鸣潮轴流程图.png";
        link.href = canvas.toDataURL("image/png");
        link.click();
      }).catch(() => {
        alert("导出失败：如果使用了网络图片，请换成本地上传图片后再试。");
      });
    }

    async function exportCapsulesAsSeparateFiles() {
      if (!state.skills.length) {
        alert("当前还没有胶囊单元可导出。");
        return;
      }

      const settings = buildDrawSettings();
      const measureCanvas = document.createElement("canvas");
      const measureCtx = measureCanvas.getContext("2d");
      measureCtx.textBaseline = "middle";
      measureCtx.textAlign = "left";
      const capsuleImage = await loadImage(state.capsuleImage);
      const avatarSize = Math.max(12, settings.avatar * settings.avatarScale);
      const folderName = `胶囊独立导出_${createTimestampLabel()}`;

      let exportFolder = null;
      if (window.showDirectoryPicker) {
        try {
          const rootFolder = await window.showDirectoryPicker({ mode: "readwrite" });
          exportFolder = await rootFolder.getDirectoryHandle(folderName, { create: true });
        } catch (error) {
          if (error && error.name === "AbortError") return;
        }
      }

      for (let index = 0; index < state.skills.length; index += 1) {
        const skill = state.skills[index];
        const role = roleById(skill.roleId);
        const hasAvatar = Boolean(role);
        const capsuleWidth = getCapsuleWidth(measureCtx, skill, settings, avatarSize, hasAvatar);
        const bounds = getCapsuleExportBounds(settings, capsuleWidth, hasAvatar, avatarSize);
        const exportCanvas = document.createElement("canvas");
        exportCanvas.width = Math.max(1, bounds.width);
        exportCanvas.height = Math.max(1, bounds.height);
        const exportCtx = exportCanvas.getContext("2d");
        exportCtx.textBaseline = "middle";
        exportCtx.textAlign = "left";

        await drawSkillPlacement(exportCtx, {
          skill,
          role,
          hasAvatar,
          capsuleWidth,
          x: -bounds.left,
          y: -bounds.top
        }, settings, capsuleImage, avatarSize);

        const blob = await canvasToBlob(exportCanvas);
        const fileName = `${String(index + 1).padStart(2, "0")}.png`;

        if (exportFolder) {
          const fileHandle = await exportFolder.getFileHandle(fileName, { create: true });
          const writable = await fileHandle.createWritable();
          await writable.write(await blob.arrayBuffer());
          await writable.close();
        } else {
          saveBlobAsDownload(blob, `${folderName}_${fileName}`);
          await new Promise((resolve) => setTimeout(resolve, 120));
        }
      }

      if (!exportFolder) {
        alert("当前环境不支持直接写入文件夹，已改为逐个下载胶囊 PNG。");
      } else {
        alert(`已导出到文件夹：${folderName}`);
      }
    }

    async function saveCurrentPreset() {
      await ensurePresetStoreReady();
      const fallbackName = makeDefaultPresetName();
      const name = ($("presetName").value || "").trim() || fallbackName;
      const snapshot = normalizePresetSnapshot(getCurrentPresetSnapshot(name), name);
      const presets = readPresetStore();
      const nextPresets = [...presets];
      nextPresets.unshift(snapshot);

      try {
        await writePresetStore(nextPresets);
      } catch (error) {
        setPresetStatus("预设保存失败，可能是本地存储空间不足。", true);
        return;
      }

      $("presetName").value = name;
      renderPresetOptions(snapshot.id);
      setPresetStatus(`已保存预设：${name}`);
    }

    async function exportCurrentPreset() {
      await ensurePresetStoreReady();
      const selectedPreset = readPresetStore().find((item) => item.id === $("presetSelect").value);
      const fallbackName = $("presetName").value.trim() || selectedPreset?.name || makeDefaultPresetName();
      const snapshot = normalizePresetSnapshot(getCurrentPresetSnapshot(fallbackName), fallbackName);
      const blob = new Blob([JSON.stringify(snapshot, null, 2)], { type: "application/json" });
      const link = document.createElement("a");
      link.download = `${sanitizePresetFileName(snapshot.name)}.json`;
      link.href = URL.createObjectURL(blob);
      link.click();
      setTimeout(() => URL.revokeObjectURL(link.href), 0);
      setPresetStatus(`已导出预设：${snapshot.name}`);
    }

    async function loadSelectedPreset() {
      await ensurePresetStoreReady();
      const presetId = $("presetSelect").value;
      if (!presetId) return;
      const preset = readPresetStore().find((item) => item.id === presetId);
      if (!preset) {
        renderPresetOptions();
        setPresetStatus("没有找到这个预设，列表已刷新。", true);
        return;
      }

      applyPresetSnapshot(preset);
      $("presetName").value = preset.name;
      renderPresetOptions(preset.id);
      setPresetStatus(`已读取预设：${preset.name}`);
    }

    async function importPresetFile(file) {
      if (!file) return;
      await ensurePresetStoreReady();
      let parsed;
      try {
        parsed = JSON.parse(await file.text());
      } catch (_) {
        setPresetStatus("导入失败：JSON 文件无法解析。", true);
        return;
      }

      const preset = normalizePresetSnapshot(parsed, file.name.replace(/\.json$/i, "") || makeDefaultPresetName());
      preset.id = uid();
      const presets = readPresetStore();
      presets.unshift(preset);

      try {
        await writePresetStore(presets);
      } catch (_) {
        setPresetStatus("导入失败：本地存储空间不足。", true);
        return;
      }

      $("presetName").value = preset.name;
      renderPresetOptions(preset.id);
      applyPresetSnapshot(preset);
      setPresetStatus(`已导入预设：${preset.name}`);
    }

    async function deleteSelectedPreset() {
      await ensurePresetStoreReady();
      const presetId = $("presetSelect").value;
      if (!presetId) return;
      const preset = readPresetStore().find((item) => item.id === presetId);
      if (!preset) return;
      if (!confirm(`确定删除预设“${preset.name}”吗？`)) return;

      const nextPresets = readPresetStore().filter((item) => item.id !== presetId);
      try {
        await writePresetStore(nextPresets);
      } catch (_) {
        setPresetStatus("删除预设失败，请稍后再试。", true);
        return;
      }

      renderPresetOptions();
      if ($("presetName").value.trim() === preset.name) $("presetName").value = "";
      setPresetStatus(`已删除预设：${preset.name}`);
    }

    function syncActiveSkillCardState() {

    function applySkillWorkspacePosition() {
      const workspace = $("globalSkillWorkspace");
      if (!workspace) return;
      const ballSize = 80;
      const panelHeight = skillWorkspaceOpen ? Math.min(420, Math.max(220, window.innerHeight * 0.68)) : 0;
      const width = ballSize;
      const height = Math.max(ballSize, ballSize + panelHeight - 8);
      const maxX = Math.max(12, window.innerWidth - width - 12);
      const maxY = Math.max(12, window.innerHeight - height - 12);
      skillWorkspacePosition.x = clamp(skillWorkspacePosition.x, 12, maxX);
      skillWorkspacePosition.y = clamp(skillWorkspacePosition.y, 12, maxY);
      workspace.style.left = `${Math.round(skillWorkspacePosition.x)}px`;
      workspace.style.top = `${Math.round(skillWorkspacePosition.y)}px`;
    }

    function setSkillWorkspaceOpen(open) {
      skillWorkspaceOpen = Boolean(open);
      renderGlobalSkillWorkspace();
      requestAnimationFrame(applySkillWorkspacePosition);
    }

    function renderGlobalSkillWorkspace() {
      const workspace = $("globalSkillWorkspace");
      if (!workspace) return;
      const formatButtons = [
        { action: "format-italic", label: "I", title: "斜体" },
        { action: "format-underline", label: "U", title: "下划线" },
        { action: "format-strike", label: "S", title: "删除线" },
        { action: "format-superscript", label: "Sup", title: "上角标" },
        { action: "format-subscript", label: "Sub", title: "下角标" }
      ];
      const index = state.skills.findIndex((item) => item.id === activeSkillWorkspaceId);
      const activeCopy = index >= 0 ? `当前正在编辑第 ${index + 1} 个胶囊` : "先点选一个技能内容框";

      workspace.classList.toggle("is-open", skillWorkspaceOpen);
      workspace.innerHTML = `
        <div class="global-skill-workspace__panel">
          <div class="global-skill-workspace__header" data-workspace-drag>
            <div class="global-skill-workspace__title">
              <strong>图文工作区</strong>
              <span>${escapeHtml(activeCopy)}</span>
            </div>
            <span class="global-skill-workspace__drag">拖动</span>
          </div>
          <div class="skill-workspace-block">
            <p class="skill-workspace-label">文字格式</p>
            <div class="skill-format-bar">
              ${formatButtons.map((button) => `<button type="button" class="skill-format-btn skill-tool-btn" data-action="${button.action}" title="${button.title}">${button.label}</button>`).join("")}
            </div>
          </div>
          <div class="skill-workspace-block">
            <p class="skill-workspace-label">按键图标</p>
            <div class="skill-icon-grid">
              ${skillIconCatalog.map((icon) => `<button type="button" class="skill-icon-btn skill-tool-btn" data-action="insert-skill-icon" data-icon-id="${icon.id}" title="${escapeAttr(icon.label)}"><img src="${escapeAttr(icon.src)}" alt="${escapeAttr(icon.label)}"></button>`).join("")}
            </div>
          </div>

      `;
      requestAnimationFrame(applySkillWorkspacePosition);
    }

    function placeCaretAtEditorEnd(editor) {
      if (!editor) return;
      const selection = window.getSelection();
      const range = document.createRange();
      range.selectNodeContents(editor);
      range.collapse(false);
      selection.removeAllRanges();
      selection.addRange(range);
    }

    function saveSkillEditorSelection(editor) {
      const card = editor?.closest("[data-skill-id]");
      if (!card) return;
      const selection = window.getSelection();
      if (!selection || !selection.rangeCount) return;
      const range = selection.getRangeAt(0);
      if (!editor.contains(range.startContainer) || !editor.contains(range.endContainer)) return;
      skillSelectionRanges.set(card.dataset.skillId, range.cloneRange());
    }

    function restoreSkillEditorSelection(editor, skillId) {
      if (!editor) return;
      editor.focus();
      const selection = window.getSelection();
      selection.removeAllRanges();
      const savedRange = skillSelectionRanges.get(skillId);
      if (savedRange) {
        try {
          selection.addRange(savedRange);
          return;
        } catch (_) {}
      }
      placeCaretAtEditorEnd(editor);
      saveSkillEditorSelection(editor);
    }

    function syncSkillEditorState(skill, editor) {
      if (!skill || !editor) return;
      skill.richText = editor.innerHTML;
      skill.text = htmlToPlainText(skill.richText);
      saveSkillEditorSelection(editor);
    }

    function insertSkillIconAtSelection(skill, editor, iconId) {
      const iconHtml = renderSkillIconHtml(iconId);
      if (!iconHtml || !skill || !editor) return;
      restoreSkillEditorSelection(editor, skill.id);
      const selection = window.getSelection();
      if (!selection || !selection.rangeCount) return;
      const range = selection.getRangeAt(0);
      range.deleteContents();
      const template = document.createElement("template");
      template.innerHTML = iconHtml;
      const iconNode = template.content.firstChild;
      if (!iconNode) return;
      range.insertNode(iconNode);
      range.setStartAfter(iconNode);
      range.collapse(true);
      selection.removeAllRanges();
      selection.addRange(range);
      syncSkillEditorState(skill, editor);
    }

    $("roleList").addEventListener("input", (event) => {
      const card = event.target.closest("[data-role-id]");
      if (!card) return;
      const role = roleById(card.dataset.roleId);

      if (event.target.dataset.field === "role-name") {

      if (event.target.dataset.field === "crop-y") role.crop = { ...(role.crop || defaultCrop()), y: Number(event.target.value) };
      if (event.target.dataset.field === "crop-size") role.crop = { ...(role.crop || defaultCrop()), size: Number(event.target.value) };
      if (String(event.target.dataset.field || "").startsWith("crop-")) {
        requestRoleCropUpdate(role, card);
        event.stopImmediatePropagation();

    $("roleList").addEventListener("change", async (event) => {
      const card = event.target.closest("[data-role-id]");
      if (!card) return;
      const role = roleById(card.dataset.roleId);
      if (!role) return;

      if (event.target.dataset.field === "role-name") {
        role.name = event.target.value;

        draw();
        event.stopImmediatePropagation();
        return;

      if (event.target.dataset.field !== "role-file") return;

    $("roleList").addEventListener("pointerdown", (event) => {
      const stage = event.target.closest('[data-field="crop-stage"]');
      if (!stage) return;
      const card = stage.closest("[data-role-id]");
      if (!card) return;
      activeCropDrag = { roleId: card.dataset.roleId, pointerId: event.pointerId };
      stage.classList.add("is-dragging");
      if (stage.setPointerCapture) stage.setPointerCapture(event.pointerId);
      updateRoleCropFromPointer(card, event.clientX, event.clientY);
      event.preventDefault();
    }, true);

    $("roleList").addEventListener("pointermove", (event) => {
      if (!activeCropDrag || activeCropDrag.pointerId !== event.pointerId) return;
      const card = $("roleList").querySelector(`[data-role-id="${activeCropDrag.roleId}"]`);
      if (!card) return;
      updateRoleCropFromPointer(card, event.clientX, event.clientY);
      event.preventDefault();
    }, true);

    function finishCropDrag(pointerId) {
      if (!activeCropDrag || activeCropDrag.pointerId !== pointerId) return;
      const card = $("roleList").querySelector(`[data-role-id="${activeCropDrag.roleId}"]`);
      const stage = card?.querySelector('[data-field="crop-stage"]');
      if (stage?.releasePointerCapture) {
        try {
          stage.releasePointerCapture(pointerId);
        } catch (_) {}
      }
      stage?.classList.remove("is-dragging");
      activeCropDrag = null;
    }

    $("roleList").addEventListener("pointerup", (event) => finishCropDrag(event.pointerId), true);
    $("roleList").addEventListener("pointercancel", (event) => finishCropDrag(event.pointerId), true);

    $("roleList").addEventListener("click", (event) => {
      const card = event.target.closest("[data-role-id]");
      if (!card) return;
      const roleId = card.dataset.roleId;
      const role = roleById(roleId);
      const action = event.target.dataset.action;

      if (action === "center-crop" && role) {
        role.crop = { ...(role.crop || defaultCrop()), x: 50, y: 50 };
        updateRoleCropUI(card, role);
        requestRoleCropUpdate(role, card);
        event.stopImmediatePropagation();
        return;
      }

      if (action === "reset-crop" && role) {
        role.crop = defaultCrop();
        updateRoleCropUI(card, role);
        requestRoleCropUpdate(role, card);
        event.stopImmediatePropagation();
        return;
      }

      if (action !== "delete-role") return;
      state.roles = state.roles.filter((item) => item.id !== roleId);
      state.skills.forEach((skill) => {
        if (skill.roleId === roleId) skill.roleId = "";
      });
      renderEditors();
      draw();
      event.stopImmediatePropagation();
    }, true);

    $("capsuleCropEditor").addEventListener("pointerdown", (event) => {
      const stage = event.target.closest('[data-field="capsule-crop-stage"]');
      if (!stage) return;
      const stretchHandle = event.target.closest("[data-stretch-handle]");
      const isStretchEditing = Boolean(state.capsuleStretchEditing);
      if (isStretchEditing && stretchHandle) {
        activeCapsuleCropDrag = {
          pointerId: event.pointerId,
          mode: String(stretchHandle.dataset.stretchHandle || "left") === "right" ? "stretch-right" : "stretch-left",
          startStretch: normalizeCapsuleStretch(state.capsuleStretch || defaultCapsuleStretch())
        };
        stage.classList.add("is-dragging");
        if (stage.setPointerCapture) stage.setPointerCapture(event.pointerId);
        event.preventDefault();
        return;
      }
      if (isStretchEditing) {
        event.preventDefault();
        return;
      }

      const handle = event.target.closest("[data-handle]");
      const cropBox = event.target.closest('[data-field="capsule-crop-box"]');
      const pointer = getCapsuleCropPointerPercent(event.clientX, event.clientY);
      const startCrop = normalizeRectCrop(state.capsuleCrop || defaultRectCrop());

      if (!pointer) return;

      if (handle) {
        activeCapsuleCropDrag = {
          pointerId: event.pointerId,
          mode: String(handle.dataset.handle || "se"),
          startPoint: pointer,
          startCrop
        };
      } else if (cropBox) {
        activeCapsuleCropDrag = {
          pointerId: event.pointerId,
          mode: "move",
          startPoint: pointer,
          startCrop
        };
      } else {
        state.capsuleCrop = normalizeRectCrop({
          ...startCrop,
          x: pointer.x - startCrop.w / 2,
          y: pointer.y - startCrop.h / 2
        });
        updateCapsuleCropUI();
        activeCapsuleCropDrag = {
          pointerId: event.pointerId,
          mode: "move",
          startPoint: pointer,
          startCrop: { ...state.capsuleCrop }
        };
      }
      stage.classList.add("is-dragging");
      if (stage.setPointerCapture) stage.setPointerCapture(event.pointerId);
      requestCapsuleCropUpdate();
      event.preventDefault();
    }, true);

    $("capsuleCropEditor").addEventListener("pointermove", (event) => {
      if (!activeCapsuleCropDrag || activeCapsuleCropDrag.pointerId !== event.pointerId) return;
      if (activeCapsuleCropDrag.mode === "stretch-left" || activeCapsuleCropDrag.mode === "stretch-right") {
        updateCapsuleStretchFromDrag(event.clientX);
        event.preventDefault();
        return;
      }
      updateCapsuleCropFromDrag(event.clientX, event.clientY);
      event.preventDefault();
    }, true);

    function finishCapsuleCropDrag(pointerId) {
      if (!activeCapsuleCropDrag || activeCapsuleCropDrag.pointerId !== pointerId) return;
      const stage = $("capsuleCropEditor").querySelector('[data-field="capsule-crop-stage"]');
      if (stage?.releasePointerCapture) {
        try {
          stage.releasePointerCapture(pointerId);
        } catch (_) {}
      }
      stage?.classList.remove("is-dragging");
      activeCapsuleCropDrag = null;
    }

    $("capsuleCropEditor").addEventListener("pointerup", (event) => finishCapsuleCropDrag(event.pointerId), true);
    $("capsuleCropEditor").addEventListener("pointercancel", (event) => finishCapsuleCropDrag(event.pointerId), true);

    $("capsuleCropEditor").addEventListener("input", (event) => {
      const field = event.target.dataset.field;
      if (field !== "capsule-crop-w" && field !== "capsule-crop-h") return;
      const crop = normalizeRectCrop({
        ...(state.capsuleCrop || defaultRectCrop()),
        w: field === "capsule-crop-w" ? Number(event.target.value) : state.capsuleCrop?.w,
        h: field === "capsule-crop-h" ? Number(event.target.value) : state.capsuleCrop?.h
      });
      state.capsuleCrop = crop;
      updateCapsuleCropUI();
      requestCapsuleCropUpdate();
    }, true);

    $("capsuleCropEditor").addEventListener("click", (event) => {
      const action = event.target.dataset.action;
      if (action === "center-capsule-crop") {
        const crop = normalizeRectCrop(state.capsuleCrop || defaultRectCrop());
        state.capsuleCrop = { ...crop, x: (100 - crop.w) / 2, y: (100 - crop.h) / 2 };
        updateCapsuleCropUI();
        requestCapsuleCropUpdate();
      }
      if (action === "reset-capsule-crop") {
        state.capsuleCrop = defaultRectCrop();
        updateCapsuleCropUI();
        requestCapsuleCropUpdate();
      }
      if (action === "toggle-capsule-stretch") {
        state.capsuleStretchEditing = !state.capsuleStretchEditing;
        if (!state.capsuleStretch) state.capsuleStretch = defaultCapsuleStretch();
        renderCapsuleCropEditor();
        draw();
      }
    }, true);

    window.addEventListener("resize", () => {

      updateCapsuleCropUI();
      applySkillWorkspacePosition();

    function clearSkillDragState() {
      activeSkillDrag = null;
      $("skillList").querySelectorAll(".skill-card").forEach((card) => {
        card.classList.remove("is-dragging", "is-drop-before", "is-drop-after");
      });
    }

    function moveSkillItem(dragId, targetId, placeAfter) {
      if (!dragId || !targetId || dragId === targetId) return;
      const fromIndex = state.skills.findIndex((item) => item.id === dragId);
      const targetIndex = state.skills.findIndex((item) => item.id === targetId);
      if (fromIndex < 0 || targetIndex < 0) return;

      const [moved] = state.skills.splice(fromIndex, 1);
      let insertIndex = targetIndex;
      if (fromIndex < targetIndex) insertIndex -= 1;
      if (placeAfter) insertIndex += 1;
      state.skills.splice(insertIndex, 0, moved);
    }

    $("skillList").addEventListener("dragstart", (event) => {
      const handle = event.target.closest(".drag-handle");
      if (!handle) return;
      const card = handle.closest("[data-skill-id]");
      if (!card) return;
      activeSkillDrag = card.dataset.skillId;
      card.classList.add("is-dragging");
      if (event.dataTransfer) {
        event.dataTransfer.effectAllowed = "move";
        event.dataTransfer.setData("text/plain", activeSkillDrag);
      }
    });

    $("skillList").addEventListener("dragover", (event) => {
      const card = event.target.closest("[data-skill-id]");
      if (!card || !activeSkillDrag || card.dataset.skillId === activeSkillDrag) return;
      event.preventDefault();
      const rect = card.getBoundingClientRect();
      const placeAfter = event.clientY >= rect.top + rect.height / 2;
      $("skillList").querySelectorAll(".skill-card").forEach((item) => {
        if (item !== card) item.classList.remove("is-drop-before", "is-drop-after");
      });
      card.classList.toggle("is-drop-before", !placeAfter);
      card.classList.toggle("is-drop-after", placeAfter);
    });

    $("skillList").addEventListener("drop", (event) => {
      const card = event.target.closest("[data-skill-id]");
      if (!card || !activeSkillDrag || card.dataset.skillId === activeSkillDrag) return;
      event.preventDefault();
      const rect = card.getBoundingClientRect();
      const placeAfter = event.clientY >= rect.top + rect.height / 2;
      moveSkillItem(activeSkillDrag, card.dataset.skillId, placeAfter);
      clearSkillDragState();
      renderEditors();
      draw();
    });

    $("skillList").addEventListener("dragend", clearSkillDragState);
    $("skillList").addEventListener("dragleave", (event) => {
      const card = event.target.closest("[data-skill-id]");
      if (!card) return;
      const related = event.relatedTarget;
      if (related && card.contains(related)) return;
      card.classList.remove("is-drop-before", "is-drop-after");
    });

    $("skillList").addEventListener("input", (event) => {
      const card = event.target.closest("[data-skill-id]");
      if (!card) return;
      const skill = state.skills.find((item) => item.id === card.dataset.skillId);
      if (!skill) return;
      if (event.target.dataset.field === "skill-richtext") {
        syncSkillEditorState(skill, event.target);
      }
      draw();

    $("skillList").addEventListener("focusin", (event) => {
      if (event.target.dataset.field !== "skill-richtext") return;
      setActiveSkillWorkspaceTarget(event.target.closest("[data-skill-id]")?.dataset.skillId || null);
      requestAnimationFrame(() => saveSkillEditorSelection(event.target));
    });

    $("skillList").addEventListener("keyup", (event) => {
      if (event.target.dataset.field !== "skill-richtext") return;
      saveSkillEditorSelection(event.target);
    });

    $("skillList").addEventListener("mouseup", (event) => {
      if (event.target.dataset.field !== "skill-richtext") return;
      saveSkillEditorSelection(event.target);
    });

    $("skillList").addEventListener("change", (event) => {
      const card = event.target.closest("[data-skill-id]");
      if (!card) return;
      const skill = state.skills.find((item) => item.id === card.dataset.skillId);
      if (!skill) return;
      if (event.target.dataset.field === "skill-role") skill.roleId = event.target.value;

    $("skillList").addEventListener("focusout", (event) => {
      if (event.target.dataset.field !== "skill-richtext") return;
      const card = event.target.closest("[data-skill-id]");
      if (!card) return;
      const skill = state.skills.find((item) => item.id === card.dataset.skillId);
      if (!skill) return;
      const sanitized = getSkillRichHtml({ richText: event.target.innerHTML, text: skill.text });
      skill.richText = sanitized;
      skill.text = htmlToPlainText(sanitized);
      event.target.innerHTML = sanitized;
      saveSkillEditorSelection(event.target);
      draw();
    }, true);

    $("skillList").addEventListener("click", (event) => {
      const actionNode = event.target.closest("[data-action]");
      if (!actionNode || !event.currentTarget.contains(actionNode)) return;
      const action = actionNode.dataset.action;
      const card = actionNode.closest("[data-skill-id]");
      const skill = card ? state.skills.find((item) => item.id === card.dataset.skillId) : null;
      if (!card || !skill) return;

      const index = state.skills.findIndex((item) => item.id === card.dataset.skillId);
      if (index < 0) return;

      if (action === "add-skill-after") {
        insertSkillAt(index + 1);
        return;
      }

      if (action === "toggle-skill-break") {
        skill.forceBreakBefore = !skill.forceBreakBefore;
        renderEditors();
        draw();
        return;
      }

      if (action === "delete-skill") {
        state.skills.splice(index, 1);
        if (activeSkillWorkspaceId === card.dataset.skillId) {
          activeSkillWorkspaceId = state.skills[Math.min(index, state.skills.length - 1)]?.id || null;
        }
      }

      renderEditors();
      draw();
    });

    $("globalSkillWorkspace").addEventListener("mousedown", (event) => {
      if (!event.target.closest(".skill-tool-btn")) return;
      event.preventDefault();
    });

    $("globalSkillWorkspace").addEventListener("pointerdown", (event) => {
      const dragHandle = event.target.closest("[data-workspace-drag]");
      if (!dragHandle) return;
      skillWorkspaceDrag = {
        pointerId: event.pointerId,
        startX: event.clientX,
        startY: event.clientY,
        originX: skillWorkspacePosition.x,
        originY: skillWorkspacePosition.y,
        moved: false
      };
      if (dragHandle.setPointerCapture) dragHandle.setPointerCapture(event.pointerId);
    });

    $("globalSkillWorkspace").addEventListener("pointermove", (event) => {
      if (!skillWorkspaceDrag || skillWorkspaceDrag.pointerId !== event.pointerId) return;
      const dx = event.clientX - skillWorkspaceDrag.startX;
      const dy = event.clientY - skillWorkspaceDrag.startY;
      if (Math.abs(dx) > 3 || Math.abs(dy) > 3) skillWorkspaceDrag.moved = true;
      skillWorkspacePosition.x = skillWorkspaceDrag.originX + dx;
      skillWorkspacePosition.y = skillWorkspaceDrag.originY + dy;
      applySkillWorkspacePosition();
    });

    function finishSkillWorkspaceDrag(event) {
      if (!skillWorkspaceDrag || skillWorkspaceDrag.pointerId !== event.pointerId) return;
      if (skillWorkspaceDrag.moved) suppressWorkspaceClick = true;
      skillWorkspaceDrag = null;
    }

    $("globalSkillWorkspace").addEventListener("pointerup", finishSkillWorkspaceDrag);
    $("globalSkillWorkspace").addEventListener("pointercancel", finishSkillWorkspaceDrag);

    $("globalSkillWorkspace").addEventListener("click", (event) => {
      const actionNode = event.target.closest("[data-action]");
      if (!actionNode) return;
      if (suppressWorkspaceClick) {
        suppressWorkspaceClick = false;
        return;
      }
      const action = actionNode.dataset.action;
      if (action === "toggle-workspace") {
        setSkillWorkspaceOpen(!skillWorkspaceOpen);
        return;
      }

      const activeContext = getActiveSkillContext();
      if (!activeContext) return;
      const { skill, editor } = activeContext;

      if (action.startsWith("format-")) {
        const commandMap = {
          "format-italic": "italic",
          "format-underline": "underline",
          "format-strike": "strikeThrough",
          "format-superscript": "superscript",
          "format-subscript": "subscript"
        };
        const command = commandMap[action];
        if (!command) return;
        restoreSkillEditorSelection(editor, skill.id);
        applySkillFormatCommand(command, editor);
        syncSkillEditorState(skill, editor);
        draw();
        return;
      }

      if (action === "insert-skill-icon") {
        insertSkillIconAtSelection(skill, editor, actionNode.dataset.iconId);
        draw();
      }
    });

    document.addEventListener("selectionchange", () => {
      const active = document.activeElement;
      if (!active || active.dataset?.field !== "skill-richtext") return;
      if (!$("skillList").contains(active)) return;
      saveSkillEditorSelection(active);
    });

    function renderGlobalSkillWorkspace() {
      const workspace = $("globalSkillWorkspace");
      if (!workspace) return;
      const formatButtons = [
        { action: "format-italic", label: "I", title: "斜体" },
        { action: "format-underline", label: "U", title: "下划线" },
        { action: "format-strike", label: "S", title: "删除线" },
        { action: "format-superscript", label: "Sup", title: "上角标" },
        { action: "format-subscript", label: "Sub", title: "下角标" }
      ];
      const index = state.skills.findIndex((item) => item.id === activeSkillWorkspaceId);
      const activeCopy = index >= 0
        ? `当前正在编辑第 ${index + 1} 个胶囊`
        : "先点选一个技能内容框";

      workspace.classList.toggle("is-open", skillWorkspaceOpen);
      workspace.innerHTML = `
        <div class="global-skill-workspace__panel">
          <div class="global-skill-workspace__header" data-workspace-drag>
            <div class="global-skill-workspace__title">
              <strong>图文工作区</strong>
              <span>${escapeHtml(activeCopy)}</span>
            </div>
            <span class="global-skill-workspace__drag">拖动</span>
          </div>
          <div class="skill-workspace-block">
            <p class="skill-workspace-label">文字格式</p>
            <div class="skill-format-bar">
              ${formatButtons.map((button) => `<button type="button" class="skill-format-btn skill-tool-btn" data-action="${button.action}" title="${button.title}">${button.label}</button>`).join("")}
            </div>
          </div>
          <div class="skill-workspace-block">
            <p class="skill-workspace-label">按键图标</p>
            <div class="skill-icon-grid">
              ${skillIconCatalog.map((icon) => `<button type="button" class="skill-icon-btn skill-tool-btn" data-action="insert-skill-icon" data-icon-id="${icon.id}" title="${escapeAttr(icon.label)}"><img src="${escapeAttr(icon.src)}" alt="${escapeAttr(icon.label)}"></button>`).join("")}
            </div>
          </div>
        </div>
        <button type="button" class="skill-workspace-fab skill-tool-btn" data-action="toggle-workspace" data-workspace-drag aria-label="展开工作区">+</button>
      `;
      requestAnimationFrame(applySkillWorkspacePosition);
    }

    renderFontOptions(getFallbackFonts());
    loadLocalFonts(false);
    ensurePresetStoreReady().then(() => {
      renderPresetOptions();
    });
    resetDemo();
  </script>
</body>
</html>
