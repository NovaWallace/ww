<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>鸣潮轴流程图生成器</title>
  <link rel="icon" type="image/jpeg" href="site-icon.jpg">
  <style>
    :root {
      --bg: #eaf5ff;
      --panel: #f7fbff;
      --line: #c8def4;
      --ink: #16324a;
      --muted: #5e7894;
      --accent: #4ba6f5;
      --accent-soft: #edf7ff;
      --capsule: #5b7391;
      --danger: #dc3545;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top right, rgba(120, 190, 255, .2), transparent 28%),
        linear-gradient(180deg, #f4fbff 0%, var(--bg) 100%);
      color: var(--ink);
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fcfeff;
      color: var(--ink);
      cursor: pointer;
      height: 36px;
      padding: 0 12px;
    }

    button:hover {
      border-color: #94c8f7;
      background: #f3faff;
    }

    button.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
      font-weight: 700;
    }

    button.soft {
      border-color: #b7dbf8;
      background: var(--accent-soft);
      color: #2f7fbc;
      font-weight: 700;
    }

    button.danger {
      border-color: #f1b8be;
      color: var(--danger);
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fcfeff;
      color: var(--ink);
      min-height: 36px;
      padding: 7px 10px;
      outline: none;
    }

    input[type="checkbox"] {
      width: auto;
      min-height: 0;
      margin-right: 8px;
      padding: 0;
      vertical-align: middle;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(75, 166, 245, .14);
    }

    textarea {
      resize: vertical;
      min-height: 70px;
    }

    label {
      display: block;
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 6px;
    }

    .app {
      display: grid;
      grid-template-columns: minmax(420px, 520px) 1fr;
      min-height: 100vh;
      height: 100vh;
      min-height: 0;
    }

    .sidebar {
      border-right: 1px solid var(--line);
      background: var(--panel);
      overflow: auto;
      min-height: 0;
      padding: 22px;
      box-shadow: inset -1px 0 0 rgba(255, 255, 255, .65);
    }

    .stage {
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      padding: 22px;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 16px;
    }

    .brand {
      display: grid;
      justify-items: start;
      gap: 12px;
      margin: 16px 0 18px;
    }

    .brand-mark {
      width: min(100%, 180px);
      height: auto;
      aspect-ratio: 1 / 1;
      border-radius: 18px;
      object-fit: cover;
      border: 1px solid #c9def4;
      box-shadow: 0 8px 20px rgba(75, 133, 191, .14);
      background: #fff;
      display: block;
    }

    .title {
      margin: 0;
      font-size: 28px;
      line-height: 1.15;
      letter-spacing: 0;
      color: #1b4d76;
    }

    .mode-switch {
      display: inline-flex;
      gap: 6px;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #eef7ff;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .7);
    }

    .mode-switch button {
      min-width: 88px;
      border-color: transparent;
      background: transparent;
      color: var(--muted);
      font-weight: 700;
    }

    .mode-switch button.is-active {
      background: #ffffff;
      border-color: #b7dbf8;
      color: var(--accent);
      box-shadow: 0 4px 12px rgba(75, 133, 191, .12);
    }

    .section {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, .9);
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 10px 30px rgba(78, 130, 184, .08);
    }

    .section h2 {
      margin: 0 0 14px;
      font-size: 16px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .grid.three {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .full {
      grid-column: 1 / -1;
    }

    .row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .row > * {
      min-width: 0;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .preset-actions {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-top: 12px;
    }

    .preset-actions button {
      width: 100%;
      padding: 0 10px;
    }

    .role-list,
    .skill-list {
      display: grid;
      gap: 10px;
    }

    .role-card,
    .skill-card {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #f9fcff;
      padding: 12px;
    }

    .role-head,
    .skill-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .role-summary {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      font-weight: 700;
    }

    .avatar-mini {
      width: 38px;
      height: 38px;
      flex: 0 0 38px;
      border-radius: 50%;
      border: 3px solid #8fb7a8;
      background: #dce8e9;
      object-fit: cover;
    }

    .skill-card {
      display: grid;
      gap: 8px;
      position: relative;
      padding: 12px 14px;
    }

    .skill-card.is-line-break {
      border-color: #8fc4f2;
      background: linear-gradient(180deg, #eef6ff 0%, #e3f0ff 100%);
    }

    .skill-card.is-dragging {
      opacity: .56;
    }

    .skill-card.is-drop-before::before,
    .skill-card.is-drop-after::after {
      content: "";
      position: absolute;
      left: 10px;
      right: 10px;
      height: 3px;
      border-radius: 999px;
      background: var(--accent);
      pointer-events: none;
    }

    .skill-card.is-drop-before::before {
      top: -2px;
    }

    .skill-card.is-drop-after::after {
      bottom: -2px;
    }

    .skill-title {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      padding-right: 72px;
    }

    .skill-title strong {
      font-size: 15px;
      line-height: 1.2;
    }

    .skill-format-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 0;
    }

    .skill-format-btn {
      min-width: 0;
      height: 30px;
      padding: 0 10px;
      font-weight: 700;
      flex: 0 0 auto;
    }

    .skill-editor {
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fcfeff;
      padding: 7px 10px;
      outline: none;
      white-space: pre-wrap;
      word-break: break-all;
      line-height: 1.2;
    }

    .skill-inline-icon {
      display: inline-block;
      width: 1.05em;
      height: 1.05em;
      vertical-align: -.16em;
      margin: 0 .16em;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }

    .skill-editor:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(75, 166, 245, .14);
    }

    .skill-editor:empty::before {
      content: attr(data-placeholder);
      color: var(--muted);
    }

    .drag-handle {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 36px;
      min-width: 36px;
      height: 36px;
      border: 1px dashed #98c5ec;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      background: #f3faff;
      box-shadow: 0 4px 12px rgba(75, 133, 191, .12);
      cursor: grab;
      user-select: none;
      font-size: 15px;
      font-weight: 700;
    }

    .drag-handle:active {
      cursor: grabbing;
    }

    .skill-card-grid {
      display: grid;
      grid-template-columns: minmax(118px, .95fr) minmax(0, 2.05fr);
      gap: 10px 12px;
      align-items: start;
    }

    .skill-card-grid .full {
      grid-column: 1 / -1;
    }

    .skill-role-field select {
      width: 100%;
    }

    .skill-text-tools,
    .skill-editor-wrap {
      min-width: 0;
    }

    .skill-editor-wrap {
      position: relative;
    }

    .skill-role-field label,
    .skill-text-tools label,
    .skill-editor-wrap label {
      display: block;
      margin-bottom: 6px;
    }

    .skill-workspace-fab {
      width: 80px;
      min-width: 80px;
      height: 80px;
      padding: 0;
      border-radius: 50%;
      border: 1px solid #8fc4f2;
      background: #4aa3ef;
      color: #fff;
      font-size: 42px;
      font-weight: 500;
      line-height: 1;
      box-shadow: 0 10px 24px rgba(46, 119, 193, .22);
    }

    .global-skill-workspace.is-open .skill-workspace-fab {
      background: #2f86d5;
      transform: rotate(45deg);
    }

    .global-skill-workspace {
      position: fixed;
      left: 24px;
      top: 120px;
      z-index: 30;
      display: block;
      pointer-events: auto;
    }

    .global-skill-workspace__panel {
      display: none;
      position: absolute;
      right: 18px;
      top: calc(100% - 8px);
      width: min(360px, calc(100vw - 96px));
      max-height: min(420px, 68vh);
      overflow: auto;
      padding: 12px;
      border: 1px solid #bdd9f2;
      border-radius: 12px;
      background: rgba(255, 255, 255, .98);
      box-shadow: 0 14px 34px rgba(45, 97, 147, .18);
      backdrop-filter: blur(8px);
    }

    .global-skill-workspace.is-open .global-skill-workspace__panel {
      display: grid;
      gap: 12px;
    }

    .global-skill-workspace .skill-workspace-fab {
      position: relative;
      z-index: 2;
    }

    .global-skill-workspace__header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      cursor: move;
      user-select: none;
      padding-bottom: 2px;
    }

    .global-skill-workspace__title {
      display: grid;
      gap: 3px;
      min-width: 0;
    }

    .global-skill-workspace__title strong {
      font-size: 14px;
      color: #1b4d76;
    }

    .global-skill-workspace__title span {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .global-skill-workspace__drag {
      border: 1px dashed #b9d7f1;
      border-radius: 999px;
      padding: 5px 10px;
      color: #4d7aa2;
      font-size: 12px;
      background: #f3f9ff;
      white-space: nowrap;
    }

    .skill-workspace-block {
      display: grid;
      gap: 10px;
    }

    .skill-workspace-label {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .skill-icon-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 8px;
    }

    .skill-icon-btn {
      min-width: 0;
      height: 46px;
      padding: 0;
      border-radius: 10px;
      border: 1px solid #c6def5;
      background: #f7fbff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .skill-icon-btn img {
      width: 28px;
      height: 28px;
      object-fit: contain;
      display: block;
    }

    .skill-card.is-active {
      border-color: #8fc4f2;
      box-shadow: 0 0 0 2px rgba(75, 166, 245, .12), 0 10px 22px rgba(78, 130, 184, .08);
    }

    .skill-head .actions {
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      gap: 8px;
      padding-right: 72px;
    }

    .skill-head .actions button {
      flex: 0 0 auto;
      height: 32px;
      padding: 0 12px;
      white-space: nowrap;
    }

    .role-block-head,
    .skill-block-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 4px;
      margin-bottom: 10px;
    }

    .role-block-head h2,
    .skill-block-head h2 {
      margin: 0;
      font-size: 16px;
    }

    .crop-shell.is-avatar-crop .crop-top {
      grid-template-columns: 1fr;
    }

    .crop-shell.is-avatar-crop .crop-stage {
      aspect-ratio: 16 / 9;
      min-height: 320px;
    }

    .crop-shell.is-avatar-crop .crop-controls {
      padding-top: 2px;
    }

    .crop-shell.is-avatar-crop .crop-meta {
      margin-bottom: 2px;
    }

    .crop-shell.is-avatar-crop .crop-size-row {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      margin: 10px 0 4px;
    }

    .crop-shell.is-avatar-crop .crop-size-row label {
      margin: 0;
      white-space: nowrap;
    }

    .crop-shell.is-avatar-crop .crop-size-row input[type="range"] {
      width: 100%;
      min-width: 0;
    }

    .crop-shell.is-avatar-crop .crop-size-value {
      min-width: 44px;
      text-align: right;
      color: var(--muted);
      font-size: 13px;
    }

    .preview-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, .92);
      padding: 14px 16px;
      box-shadow: 0 10px 24px rgba(78, 130, 184, .08);
    }

    .preview-toolbar h2 {
      margin: 0;
      font-size: 18px;
    }

    .canvas-wrap {
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background:
        linear-gradient(45deg, #edf1f7 25%, transparent 25%),
        linear-gradient(-45deg, #edf1f7 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #edf1f7 75%),
        linear-gradient(-45deg, transparent 75%, #edf1f7 75%);
      background-color: #fafdff;
      background-size: 24px 24px;
      background-position: 0 0, 0 12px, 12px -12px, -12px 0;
      padding: 24px;
      box-shadow: 0 12px 28px rgba(78, 130, 184, .08);
    }

    canvas {
      display: block;
      max-width: none;
      box-shadow: 0 12px 30px rgba(34, 47, 78, .15);
      background: transparent;
    }

    .page-credit {
      position: fixed;
      right: 18px;
      bottom: 14px;
      z-index: 20;
      padding: 7px 12px;
      border: 1px solid #c7dcf0;
      border-radius: 999px;
      background: rgba(247, 251, 255, .92);
      color: #64819d;
      font-size: 12px;
      box-shadow: 0 8px 20px rgba(75, 133, 191, .12);
      backdrop-filter: blur(8px);
    }

    .hint {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
      margin: 8px 0 0;
    }

    .empty {
      border: 1px dashed #bfd1e6;
      border-radius: 8px;
      color: var(--muted);
      padding: 14px;
      text-align: center;
    }

    .tiny {
      width: 64px;
      flex: 0 0 64px;
    }

    .color-input {
      width: 44px;
      min-width: 44px;
      padding: 4px;
    }

    .config-stack {
      display: grid;
      gap: 10px;
    }

    .config-group {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfdff;
      overflow: hidden;
    }

    .config-group summary {
      list-style: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 13px 14px;
      font-weight: 700;
      user-select: none;
    }

    .config-group summary::-webkit-details-marker {
      display: none;
    }

    .config-group summary::after {
      content: "+";
      color: var(--accent);
      font-size: 18px;
      line-height: 1;
    }

    .config-group[open] summary::after {
      content: "-";
    }

    .config-body {
      padding: 0 14px 14px;
      border-top: 1px solid var(--line);
    }

    .summary-meta {
      color: var(--muted);
      font-size: 12px;
      font-weight: 400;
      margin-left: auto;
      white-space: nowrap;
    }

    .mode-only {
      display: none;
    }

    body[data-layout-mode="horizontal"] .mode-only.mode-horizontal,
    body[data-layout-mode="flow"] .mode-only.mode-horizontal {
      display: block;
    }

    body[data-layout-mode="horizontal"] .mode-only.mode-horizontal.grid-item,
    body[data-layout-mode="flow"] .mode-only.mode-horizontal.grid-item {
      display: block;
    }

    body[data-layout-mode="flow"] .mode-only.mode-flow {
      display: block;
    }

    body[data-layout-mode="flow"] .mode-only.mode-flow.grid-item {
      display: block;
    }

    .toggle-line {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      min-height: 36px;
      padding: 0 2px;
    }

    .toggle-line input[type="checkbox"] {
      margin: 0;
      flex: 0 0 auto;
    }

    .toggle-line label {
      margin: 0;
      color: var(--ink);
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
    }

    .toggle-copy {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex-wrap: wrap;
    }

    .crop-shell {
      display: grid;
      gap: 14px;
      margin-top: 12px;
      padding: 12px;
      border: 1px dashed #bfd1e6;
      border-radius: 8px;
      background: #fff;
    }

    .crop-top {
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(220px, .95fr);
      gap: 14px;
      align-items: stretch;
    }

    .crop-stage {
      position: relative;
      min-height: 0;
      aspect-ratio: 4 / 3;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      background:
        linear-gradient(45deg, #edf1f7 25%, transparent 25%),
        linear-gradient(-45deg, #edf1f7 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #edf1f7 75%),
        linear-gradient(-45deg, transparent 75%, #edf1f7 75%);
      background-color: #fff;
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0;
      cursor: grab;
      touch-action: none;
    }

    .crop-stage.is-dragging {
      cursor: grabbing;
    }

    .crop-source {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      user-select: none;
      pointer-events: none;
    }

    .crop-overlay {
      position: absolute;
      border: 2px solid var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 0 999px rgba(23, 32, 51, .4);
      pointer-events: none;
    }

    .crop-side {
      display: grid;
      gap: 12px;
      align-content: stretch;
    }

    .crop-shell.is-capsule-crop .crop-top {
      display: block;
    }

    .crop-shell.is-capsule-crop {
      display: flex;
      flex-direction: column;
      gap: 14px;
      align-items: stretch;
    }

    .crop-shell.is-capsule-crop .crop-stage {
      aspect-ratio: 4 / 3;
      min-height: 400px;
      width: 100%;
    }

    .crop-shell.is-capsule-crop .crop-controls {
      display: grid;
      justify-items: center;
      margin-top: 2px;
    }

    .crop-shell.is-capsule-crop .crop-source {
      position: absolute;
      inset: 0;
    }

    .crop-preview-panel {
      aspect-ratio: 4 / 3;
      min-height: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background:
        linear-gradient(45deg, #edf1f7 25%, transparent 25%),
        linear-gradient(-45deg, #edf1f7 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #edf1f7 75%),
        linear-gradient(-45deg, transparent 75%, #edf1f7 75%);
      background-color: #fafdff;
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0;
      display: grid;
      place-items: center;
      padding: 16px;
    }

    .crop-shell.is-capsule-crop .crop-box {
      box-shadow: none;
      background: rgba(75, 166, 245, .08);
    }

    .crop-shell.is-capsule-crop.is-stretch-editing .crop-box {
      opacity: .34;
      pointer-events: none;
      filter: saturate(.72);
    }

    .crop-shell.is-capsule-crop.is-stretch-editing .crop-stage {
      cursor: default;
    }

    .crop-preview {
      width: 132px;
      height: 132px;
      border-radius: 50%;
      border: 5px solid #384244;
      background: #dce8e9;
      object-fit: cover;
    }

    .crop-box {
      position: absolute;
      border: 2px solid var(--accent);
      border-radius: 14px;
      box-shadow: 0 0 0 999px rgba(23, 32, 51, .14);
      cursor: move;
      touch-action: none;
      background: transparent;
    }

    .crop-stretch-guide {
      position: absolute;
      display: none;
      border-radius: 14px;
      pointer-events: none;
      overflow: visible;
    }

    .crop-shell.is-capsule-crop.is-stretch-editing .crop-stretch-guide {
      display: block;
    }

    .crop-stretch-window {
      position: absolute;
      top: 0;
      bottom: 0;
      background: rgba(75, 166, 245, .16);
      border-top: 2px solid rgba(75, 166, 245, .5);
      border-bottom: 2px solid rgba(75, 166, 245, .5);
      pointer-events: none;
    }

    .crop-stretch-line {
      position: absolute;
      top: -8px;
      bottom: -8px;
      width: 0;
      border-left: 2px solid #2b7fd8;
      pointer-events: auto;
      cursor: ew-resize;
    }

    .crop-stretch-line::before {
      content: "";
      position: absolute;
      left: -8px;
      top: 50%;
      width: 16px;
      height: 30px;
      transform: translateY(-50%);
      border-radius: 999px;
      background: rgba(255, 255, 255, .92);
      border: 1px solid rgba(43, 127, 216, .28);
      box-shadow: 0 4px 12px rgba(28, 72, 116, .14);
    }

    .crop-handle {
      position: absolute;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid #fff;
      background: var(--accent);
      box-shadow: 0 2px 8px rgba(22, 50, 74, .24);
    }

    .crop-handle[data-handle="nw"] {
      left: -7px;
      top: -7px;
      cursor: nwse-resize;
    }

    .crop-handle[data-handle="ne"] {
      right: -7px;
      top: -7px;
      cursor: nesw-resize;
    }

    .crop-handle[data-handle="sw"] {
      left: -7px;
      bottom: -7px;
      cursor: nesw-resize;
    }

    .crop-handle[data-handle="se"] {
      right: -7px;
      bottom: -7px;
      cursor: nwse-resize;
    }

    .crop-preview.is-rect {
      width: 100%;
      height: auto;
      max-height: 100%;
      border-radius: 14px;
      border-width: 4px;
      background: #ddeaf6;
      object-fit: contain;
      display: block;
    }

    .crop-meta {
      margin: 0;
      text-align: center;
    }

    .crop-meta-inputs {
      display: inline-grid;
      grid-template-columns: auto minmax(72px, 96px) auto minmax(72px, 96px);
      gap: 8px;
      align-items: center;
      justify-content: center;
      margin-top: 6px;
    }

    .crop-meta-inputs input {
      text-align: center;
      padding-left: 10px;
      padding-right: 10px;
    }

    .crop-controls {
      display: grid;
      gap: 10px;
      position: relative;
      z-index: 1;
    }

    .slider-stack {
      display: grid;
      gap: 10px;
    }

    input[type="range"] {
      padding: 0;
      min-height: 22px;
    }

    .file-line {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: end;
    }

    .file-picker {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 10px;
      align-items: center;
      min-height: 48px;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfdff;
    }

    .file-picker input[type="file"] {
      display: none;
    }

    .file-picker-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 92px;
      height: 38px;
      padding: 0 14px;
      border: 1px solid #b9cde2;
      border-radius: 8px;
      background: #fff;
      color: var(--text);
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .file-picker-name {
      min-width: 0;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status-line {
      min-height: 20px;
    }

    @media (max-width: 980px) {
      .app {
        grid-template-columns: 1fr;
        height: auto;
        min-height: 100vh;
      }

      .sidebar {
        border-right: 0;
        border-bottom: 1px solid var(--line);
        min-height: auto;
      }

      .stage {
        min-height: auto;
        overflow: visible;
      }

      .page-credit {
        right: 12px;
        bottom: 12px;
      }

      .preset-actions,
      .skill-card-grid {
        grid-template-columns: 1fr;
      }

      .skill-head .actions,
      .skill-title {
        padding-right: 0;
      }

      .drag-handle {
        top: 10px;
        right: 10px;
      }

      .skill-format-bar {
        flex-wrap: wrap;
      }
    }

    @media (max-width: 560px) {
      .grid,
      .grid.three {
        grid-template-columns: 1fr;
      }

      .crop-top {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <aside class="sidebar">
      <div class="mode-switch" id="layoutModeSwitch">
        <button type="button" data-mode="vertical" class="is-active">竖版</button>
        <button type="button" data-mode="horizontal">横版</button>
        <button type="button" data-mode="flow">整图</button>
      </div>
      <div class="brand">
        <img class="brand-mark" src="site-icon.jpg" alt="鸣潮轴流程图生成器图标">
        <h1 class="title">鸣潮轴流程图生成器</h1>
      </div>

      <section class="section">
        <details class="config-group" open>
          <summary>
            模板
            <span class="summary-meta">本地与 JSON</span>
          </summary>
          <div class="config-body">
            <div class="grid">
              <div class="full">
                <label for="presetName">名称</label>
                <input id="presetName" placeholder="例如：今汐常用">
              </div>
              <div class="full">
                <label for="presetSelect">已保存</label>
                <select id="presetSelect"></select>
              </div>
            </div>
            <div class="preset-actions">
              <button class="soft" id="savePreset" type="button">保存</button>
              <button id="loadPreset" type="button">读取</button>
              <button id="exportPreset" type="button">导出 JSON</button>
              <button id="importPreset" type="button">导入 JSON</button>
              <button class="danger" id="deletePreset" type="button">删除</button>
            </div>
            <input id="presetImportFile" type="file" accept="application/json,.json" hidden>
            <p class="hint status-line" id="presetStatus">会保存在当前浏览器，本地头像和底图也会一起记住。</p>
          </div>
        </details>
      </section>

      <section class="section">
        <h2>布局与样式</h2>
        <div class="config-stack">
          <details class="config-group" open>
            <summary>
              画布
              <span class="summary-meta">总图尺寸与预览</span>
            </summary>
            <div class="config-body">
              <div class="grid">
                <div>
                  <label for="canvasWidth">总图宽度 px</label>
                  <input id="canvasWidth" type="number" min="100" value="900">
                </div>
                <div>
                  <label for="canvasHeight">总图高度 px</label>
                  <input id="canvasHeight" type="number" min="100" value="1200">
                </div>
                <div>
                  <label>底图输出</label>
                  <div class="toggle-line">
                    <input id="flowSizeLock" class="mode-only mode-flow" type="checkbox">
                    <div class="toggle-copy">
                      <label for="flowSizeLock" class="mode-only mode-flow">大小锁定</label>
                      <span class="hint mode-only mode-flow">超出总图高度时自动等比缩小胶囊</span>
                    </div>
                  </div>
                </div>
                <div>
                  <label for="scale">预览缩放</label>
                  <select id="scale">
                    <option value="0.4">40%</option>
                    <option value="0.6" selected>60%</option>
                    <option value="0.8">80%</option>
                    <option value="1">100%</option>
                  </select>
                </div>
              </div>
            </div>
          </details>

          <details class="config-group" open>
            <summary>
              胶囊
              <span class="summary-meta">长宽、间距、底图</span>
            </summary>
            <div class="config-body">
              <div class="grid three">
                <div>
                  <label for="capsuleWidth">胶囊宽度 px</label>
                  <input id="capsuleWidth" type="number" min="80" value="760">
                </div>
                <div>
                  <label for="capsuleHeight">胶囊高度 px</label>
                  <input id="capsuleHeight" type="number" min="40" value="150">
                </div>
                <div>
                  <label for="capsuleGap">纵向间距 px</label>
                  <input id="capsuleGap" type="number" min="0" value="38">
                </div>
                <div>
                  <label for="capsuleX">起始 X px</label>
                  <input id="capsuleX" type="number" min="0" value="70">
                </div>
                <div>
                  <label for="capsuleY">起始 Y px</label>
                  <input id="capsuleY" type="number" min="0" value="60">
                </div>
                <div>
                  <label for="capsuleColor">胶囊颜色</label>
                  <input id="capsuleColor" type="color" value="#4b4b4b" class="color-input">
                </div>
                <div class="mode-only mode-horizontal grid-item">
                  <label for="capsuleWidthMode">横版宽度模式</label>
                  <select id="capsuleWidthMode">
                    <option value="auto">跟随内容</option>
                    <option value="fixed">固定宽度</option>
                  </select>
                </div>
                <div class="mode-only mode-horizontal grid-item">
                  <label for="capsuleGapX">横向间距 px</label>
                  <input id="capsuleGapX" type="number" min="0" value="28">
                </div>
                <div class="mode-only mode-horizontal grid-item">
                  <label for="capsuleRightPad">横版右方空余 px</label>
                  <input id="capsuleRightPad" type="number" min="0" value="36">
                </div>
                <div class="full">
                  <label for="capsuleFile">自定义胶囊底图</label>
                  <div class="file-line">
                    <div class="file-picker">
                      <label class="file-picker-button" for="capsuleFile">浏览...</label>
                      <span class="file-picker-name" id="capsuleFileName">未选择文件</span>
                      <input id="capsuleFile" type="file" accept="image/*">
                    </div>
                    <button id="clearCapsuleImage" type="button">清除底图</button>
                  </div>
                  <p class="hint">上传后会用底图左中右三段来铺满胶囊，适合做带纹理或渐变的自定义底图。</p>
                  <div id="capsuleCropEditor"></div>
                </div>
              </div>
            </div>
          </details>

          <details class="config-group">
            <summary>
              头像与文字
              <span class="summary-meta">位置微调</span>
            </summary>
            <div class="config-body">
              <div class="grid">
                <div>
                  <label for="avatarSize">头像大小 px</label>
                  <input id="avatarSize" type="number" min="20" value="120">
                </div>
                <div>
                  <label for="avatarScale">头像缩放 %</label>
                  <input id="avatarScale" type="number" min="10" value="100">
                </div>
                <div>
                  <label for="avatarInset">头像 X 位置 px</label>
                  <input id="avatarInset" type="number" min="-2000" value="24">
                </div>
                <div>
                  <label for="avatarOffsetY">头像 Y 偏移 px</label>
                  <input id="avatarOffsetY" type="number" value="0">
                </div>
                <div>
                  <label for="textAlign">文字对齐</label>
                  <select id="textAlign">
                    <option value="left">左对齐</option>
                    <option value="center">居中对齐</option>
                    <option value="right">右对齐</option>
                  </select>
                </div>
                <div>
                  <label for="textInset">有头像时文字锚点 X px</label>
                  <input id="textInset" type="number" min="0" value="190">
                </div>
                <div>
                  <label for="noAvatarTextInset">无头像时文字锚点 X px</label>
                  <input id="noAvatarTextInset" type="number" min="0" value="120">
                </div>
              </div>
            </div>
          </details>
        </div>
      </section>

      <section class="section">
        <details class="config-group" open>
          <summary>
            角色
            <span class="summary-meta">头像上传与裁剪</span>
          </summary>
          <div class="config-body">
            <div class="role-block-head">
              <h2>角色列表</h2>
              <button class="soft" id="addRole">+添加</button>
            </div>
            <div id="roleList" class="role-list"></div>
            <p class="hint">头像可以上传本地图片，也可以填写图片 URL。本地上传最稳定，导出 PNG 不会受跨站限制影响。</p>
          </div>
        </details>
      </section>

      <section class="section">
        <div class="skill-block-head">
          <h2>胶囊单元</h2>
          <button class="soft" id="addSkill">+添加</button>
        </div>
        <div class="grid">
          <div class="full">
            <label for="fontFamily">字体</label>
            <div class="file-line">
              <input id="fontFamily" list="fontFamilyOptions" value="Microsoft YaHei" placeholder="输入或选择字体名称">
              <button id="loadFonts" type="button">读取本机字体</button>
            </div>
            <datalist id="fontFamilyOptions"></datalist>
          </div>
          <div>
            <label for="fontSize">字体大小 px</label>
            <input id="fontSize" type="number" min="8" value="86">
          </div>
          <div>
            <label for="fontColor">文字颜色</label>
            <input id="fontColor" type="color" value="#ffffff" class="color-input">
          </div>
          <div>
            <label for="fontWeight">字重</label>
            <select id="fontWeight">
              <option value="700">粗体</option>
              <option value="900" selected>特粗</option>
              <option value="400">常规</option>
            </select>
          </div>
        </div>
        <div id="skillList" class="skill-list" style="margin-top: 12px;"></div>
      </section>
    </aside>

    <section class="stage">
      <div class="preview-toolbar">
        <h2>预览</h2>
        <div class="actions">
          <button id="fitCanvas">按内容调整画布</button>
          <button id="resetDemo">还原示例</button>
          <button id="exportCapsules">胶囊独立导出</button>
          <button class="primary" id="download">下载 PNG</button>
        </div>
      </div>
      <div class="canvas-wrap">
        <canvas id="output" width="900" height="1200"></canvas>
      </div>
    </section>
  </main>
  <div class="page-credit">b站 灵殊Nova 制作</div>

  <script>
    const $ = (id) => document.getElementById(id);

    const controls = [
      "layoutMode", "canvasWidth", "canvasHeight", "flowSizeLock", "scale",
      "capsuleWidth", "capsuleHeight", "capsuleGap", "capsuleX", "capsuleY",
      "capsuleGapX", "capsuleRightPad", "capsuleWidthMode",
      "capsuleColor", "avatarSize", "avatarScale", "avatarInset", "avatarOffsetY", "textInset", "noAvatarTextInset",
      "textAlign", "fontFamily", "fontSize", "fontColor", "fontWeight"
    ];

    const PRESET_STORAGE_KEY = "wuthering_combo_builder_presets_v1";
    const PRESET_DB_NAME = "wuthering_combo_builder_db";
    const PRESET_DB_STORE = "presets";

    const state = {
      layoutMode: "vertical",
      roles: [],
      skills: [],
      capsuleImage: "",
      capsuleImageOriginal: "",
      capsuleCrop: null,
      capsuleStretch: null,
      capsuleStretchEditing: false,
      capsuleImageLabel: ""
    };

    const imageCache = new Map();
    let activeCropDrag = null;
    let activeCapsuleCropDrag = null;
    let activeSkillDrag = null;
    let activeSkillWorkspaceId = null;
    let skillWorkspaceOpen = false;
    let skillWorkspaceDrag = null;
    let suppressWorkspaceClick = false;
    let skillWorkspacePosition = { x: 28, y: 112 };
    let presetStoreCache = [];
    let presetStoreReady = null;
    const skillSelectionRanges = new Map();

    let presetStatusTimer = null;

    const demoImages = [
      makeAvatar("#d7ece9", "#343a40", "维"),
      makeAvatar("#f4d1d1", "#313948", "吟")
    ];

    const skillIconDataUrls = window.skillIconDataUrls || {};
    const resolveSkillIconSrc = (id) => skillIconDataUrls[id] || `assets/button-icons/${id}.png`;
    const skillIconCatalog = [
      { id: "mouse-left", label: "左键" },
      { id: "mouse-right", label: "右键" },
      { id: "mouse-left-hold", label: "左键长按" },
      { id: "mouse-right-hold", label: "右键长按" },
      { id: "skill", label: "技能" },
      { id: "liberation", label: "解放" },
      { id: "echo", label: "声骸" },
      { id: "tool", label: "工具" },
      { id: "finisher", label: "处决" },
      { id: "jump", label: "跳跃" },
      { id: "skill-hold", label: "长按技能" },
      { id: "liberation-hold", label: "长按解放" },
      { id: "echo-hold", label: "长按声骸" },
      { id: "jump-hold", label: "长按跳跃" }
    ].map((icon) => ({ ...icon, src: resolveSkillIconSrc(icon.id) }));
    const skillIconMap = Object.fromEntries(skillIconCatalog.map((item) => [item.id, item]));

    function uid() {
      return Math.random().toString(36).slice(2, 10);
    }

    function safeClone(value, fallback) {
      if (!value || typeof value !== "object") return fallback;
      return { ...value };
    }

    function makeDefaultPresetName() {
      const now = new Date();
      const pad = (value) => String(value).padStart(2, "0");
      return `预设 ${pad(now.getMonth() + 1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
    }

    function setPresetStatus(message, isError = false) {
      const node = $("presetStatus");
      if (!node) return;
      node.textContent = message;
      node.style.color = isError ? "var(--danger)" : "var(--muted)";
      if (presetStatusTimer) clearTimeout(presetStatusTimer);
      presetStatusTimer = setTimeout(() => {
        node.textContent = "预设会保存在当前浏览器本地，角色头像和胶囊底图也会一起记住。";
        node.style.color = "var(--muted)";
      }, 2600);
    }

    function readLegacyPresetStore() {
      try {
        const raw = localStorage.getItem(PRESET_STORAGE_KEY);
        const parsed = raw ? JSON.parse(raw) : [];
        if (!Array.isArray(parsed)) return [];
        return parsed.map((item) => normalizePresetSnapshot(item, item?.name || makeDefaultPresetName()));
      } catch (_) {
        return [];
      }
    }

    function readPresetStore() {
      return presetStoreCache.map((item) => normalizePresetSnapshot(item, item?.name || makeDefaultPresetName()));
    }

    function openPresetDatabase() {
      if (!("indexedDB" in window)) return Promise.resolve(null);
      return new Promise((resolve, reject) => {
        const request = window.indexedDB.open(PRESET_DB_NAME, 1);
        request.onupgradeneeded = () => {
          const db = request.result;
          if (!db.objectStoreNames.contains(PRESET_DB_STORE)) {
            db.createObjectStore(PRESET_DB_STORE, { keyPath: "id" });
          }
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    async function readPresetStoreFromDatabase() {
      const db = await openPresetDatabase();
      if (!db) return [];
      return new Promise((resolve, reject) => {
        const tx = db.transaction(PRESET_DB_STORE, "readonly");
        const store = tx.objectStore(PRESET_DB_STORE);
        const request = store.getAll();
        request.onsuccess = () => {
          const rows = Array.isArray(request.result) ? request.result : [];
          resolve(rows.map((item) => normalizePresetSnapshot(item, item?.name || makeDefaultPresetName())));
        };
        request.onerror = () => reject(request.error);
      });
    }

    async function writePresetStore(presets) {
      const normalized = presets.map((item) => normalizePresetSnapshot(item, item?.name || makeDefaultPresetName()));
      presetStoreCache = normalized;

      const db = await openPresetDatabase();
      if (!db) {
        localStorage.setItem(PRESET_STORAGE_KEY, JSON.stringify(normalized));
        return;
      }

      await new Promise((resolve, reject) => {
        const tx = db.transaction(PRESET_DB_STORE, "readwrite");
        const store = tx.objectStore(PRESET_DB_STORE);
        store.clear();
        normalized.forEach((preset) => {
          store.put(preset);
        });
        tx.oncomplete = resolve;
        tx.onerror = () => reject(tx.error);
        tx.onabort = () => reject(tx.error);
      });

      localStorage.removeItem(PRESET_STORAGE_KEY);
    }

    async function ensurePresetStoreReady() {
      if (!presetStoreReady) {
        presetStoreReady = (async () => {
          try {
            const dbPresets = await readPresetStoreFromDatabase();
            if (dbPresets.length) {
              presetStoreCache = dbPresets;
              localStorage.removeItem(PRESET_STORAGE_KEY);
              return;
            }
          } catch (_) {}

          const legacyPresets = readLegacyPresetStore();
          presetStoreCache = legacyPresets;
          if (legacyPresets.length) {
            try {
              await writePresetStore(legacyPresets);
            } catch (_) {}
          }
        })();
      }

      await presetStoreReady;
    }

    function formatPresetTime(value) {
      if (!value) return "";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return "";
      return date.toLocaleString("zh-CN", {
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    function getFallbackFonts() {
      return [
        "Microsoft YaHei", "SimHei", "KaiTi", "SimSun", "NSimSun", "FangSong",
        "Arial", "Arial Black", "Calibri", "Cambria", "Consolas", "Courier New",
        "Georgia", "Impact", "Segoe UI", "Tahoma", "Times New Roman", "Trebuchet MS",
        "Verdana", "PingFang SC", "Source Han Sans SC", "Source Han Serif SC"
      ];
    }

    function renderFontOptions(fonts) {
      const datalist = $("fontFamilyOptions");
      if (!datalist) return;
      const current = $("fontFamily").value;
      const merged = Array.from(new Set([...fonts, current].filter(Boolean))).sort((a, b) => a.localeCompare(b, "zh-CN"));
      datalist.innerHTML = merged.map((font) => `<option value="${escapeAttr(font)}"></option>`).join("");
    }

    async function loadLocalFonts(showStatus = false) {
      let fonts = getFallbackFonts();
      if (typeof window.queryLocalFonts === "function") {
        try {
          const localFonts = await window.queryLocalFonts();
          const families = localFonts.map((font) => font.family).filter(Boolean);
          if (families.length) fonts = Array.from(new Set(families));
          if (showStatus) setPresetStatus(`已读取本机字体：${fonts.length} 项`);
        } catch (_) {
          if (showStatus) setPresetStatus("读取本机字体失败，已保留常用字体列表。", true);
        }
      } else if (showStatus) {
        setPresetStatus("当前环境不支持直接读取本机字体，已保留常用字体列表。", true);
      }

      renderFontOptions(fonts);
    }

    function sanitizePresetFileName(name) {
      return String(name || "preset").replace(/[\\/:*?\"<>|]+/g, "_");
    }

    function normalizePresetSnapshot(data, fallbackName = makeDefaultPresetName()) {
      const baseControls = captureControlValues();
      const incomingControls = data && typeof data.controls === "object" ? data.controls : {};
      const normalizedControls = { ...baseControls };
      Object.keys(normalizedControls).forEach((id) => {
        if (Object.prototype.hasOwnProperty.call(incomingControls, id)) {
          normalizedControls[id] = incomingControls[id];
        }
      });

      return {
        id: String(data?.id || uid()),
        version: 1,
        name: String(data?.name || fallbackName).trim() || fallbackName,
        savedAt: typeof data?.savedAt === "string" ? data.savedAt : new Date().toISOString(),
        layoutMode: data?.layoutMode === "horizontal"
          ? "horizontal"
          : data?.layoutMode === "flow"
            ? "flow"
            : "vertical",
        controls: normalizedControls,
        roles: Array.isArray(data?.roles) ? data.roles.map(cloneRole) : [],
        skills: Array.isArray(data?.skills) ? data.skills.map(cloneSkill) : [],
        capsuleImage: String(data?.capsuleImage || ""),
        capsuleImageOriginal: String(data?.capsuleImageOriginal || ""),
        capsuleCrop: safeClone(data?.capsuleCrop, defaultRectCrop()),
        capsuleStretch: safeClone(data?.capsuleStretch, defaultCapsuleStretch()),
        capsuleImageLabel: String(data?.capsuleImageLabel || "")
      };
    }

    function readNumber(id) {
      const value = Number($(id).value);
      return Number.isFinite(value) ? value : 0;
    }

    function readControlValue(node) {
      if (!node) return "";
      return node.type === "checkbox" ? node.checked : node.value;
    }

    function writeControlValue(node, value) {
      if (!node) return;
      if (node.type === "checkbox") {
        node.checked = value === true || value === "true" || value === 1 || value === "1";
      } else {
        node.value = String(value);
      }
    }

      state.layoutMode = mode === "horizontal" || mode === "flow" ? mode : "vertical";
      syncLayoutModeUI();
      if ((state.layoutMode === "horizontal" || state.layoutMode === "flow") && !options.preserveSmallCanvas && readNumber("canvasWidth") < 1600) {

    function captureControlValues() {
      return controls.reduce((result, id) => {

    function applyPresetSnapshot(preset) {
      if (!preset || typeof preset !== "object") return;

      const nextRoles = Array.isArray(preset.roles) ? preset.roles.map(cloneRole) : [];
      const validRoleIds = new Set(nextRoles.map((role) => role.id));
      const nextSkills = Array.isArray(preset.skills)
        ? preset.skills.map(cloneSkill).map((skill) => ({
            ...skill,
            roleId: validRoleIds.has(skill.roleId) ? skill.roleId : ""
          }))
        : [];

      state.roles = nextRoles;
      state.skills = nextSkills;
      state.capsuleImage = String(preset.capsuleImage || "");
      state.capsuleImageOriginal = String(preset.capsuleImageOriginal || "");
      state.capsuleCrop = safeClone(preset.capsuleCrop, defaultRectCrop());
      state.capsuleStretch = safeClone(preset.capsuleStretch, defaultCapsuleStretch());
      state.capsuleStretchEditing = false;
      state.capsuleImageLabel = String(preset.capsuleImageLabel || "");

      const values = preset.controls && typeof preset.controls === "object" ? preset.controls : {};
      Object.entries(values).forEach(([id, value]) => {
        const node = $(id);
        if (node) writeControlValue(node, value);
      });

      setLayoutMode(String(preset.layoutMode || values.layoutMode || "vertical"), { preserveSmallCanvas: true });
      renderEditors();
      draw();
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[char]));
    }

    function escapeAttr(value) {
      return escapeHtml(value).replace(/`/g, "&#96;");
    }

    function plainTextToRichHtml(text) {
      return escapeHtml(String(text || "")).replace(/\r?\n/g, "<br>");
    }

    function renderSkillIconHtml(iconId) {
      const icon = skillIconMap[String(iconId || "")];
      if (!icon) return "";
      return `<img class="skill-inline-icon" data-skill-icon="${escapeAttr(icon.id)}" src="${escapeAttr(icon.src)}" alt="${escapeAttr(icon.label)}" contenteditable="false">`;
    }

    function getSkillIconMetrics(settings = {}) {
      const size = Math.max(18, Number(settings.fontSize || 24) * 0.94);
      const gap = Math.max(4, size * 0.14);
      return {
        size,
        gap,
        width: size + gap * 2
      };
    }

    function sanitizeSkillRichText(html) {
      const template = document.createElement("template");
      template.innerHTML = String(html || "");

      function walk(node) {
        if (node.nodeType === Node.TEXT_NODE) {
          return escapeHtml((node.textContent || "").replace(/\u00a0/g, " "));
        }
        if (node.nodeType !== Node.ELEMENT_NODE) return "";

        const tag = node.tagName.toLowerCase();
        if (tag === "br") return "<br>";
        if (tag === "img") {
          const iconId = String(node.getAttribute("data-skill-icon") || "").trim();
          return renderSkillIconHtml(iconId);
        }

        const content = Array.from(node.childNodes).map(walk).join("");
        if (tag === "div" || tag === "p") return `${content}<br>`;
        const styleText = String(node.getAttribute?.("style") || "").toLowerCase();
        const wrappers = [];

        if (tag === "i" || tag === "em" || styleText.includes("font-style: italic")) wrappers.push("i");
        if (tag === "u" || styleText.includes("underline")) wrappers.push("u");
        if (tag === "s" || tag === "strike" || tag === "del" || styleText.includes("line-through")) wrappers.push("s");
        if (tag === "sup" || styleText.includes("vertical-align: super")) wrappers.push("sup");
        if (tag === "sub" || styleText.includes("vertical-align: sub")) wrappers.push("sub");

        return wrappers.reduce((result, wrapper) => `<${wrapper}>${result}</${wrapper}>`, content);
      }

      return Array.from(template.content.childNodes)
        .map(walk)
        .join("")
        .replace(/(?:<br>)+$/g, "")
        .replace(/(<br>){3,}/g, "<br><br>");
    }

    function getSkillRichHtml(skill) {
      return sanitizeSkillRichText(skill?.richText || plainTextToRichHtml(skill?.text || ""));
    }
